function vStats(){
  let h="";

  /* Weekly Digest — build order item 6. Everything here is already
     computed elsewhere (score, muscle volume, adherence); this just rolls
     it into one shareable block instead of making him hunt across cards. */
  const digest=computeDigest();
  if(digest){
    h+=`<div class="card hero"><div class="ttl">Weekly digest<span class="mono">${esc(digest.range[0]||"")} → ${esc(digest.range[1]||"")}</span></div>
     <div class="note" style="white-space:pre-line;line-height:1.7">${esc(digestText(digest))}</div>
     <button class="btn sm full" style="margin-top:10px" onclick="copyDigest()">Copy for WhatsApp</button></div>`;
  }

  /* Weekly score + today's breakdown. The engine shows its working —
     every line is traceable to a Score Rules row. */
  if(!SCORE.rulesLoaded){
    h+=`<div class="card"><div class="ttl">Score</div>
     <div class="note">Score Rules table didn't load. Scoring is off rather than guessed at.</div>
     <button class="btn sm full" style="margin-top:9px" onclick="loadAll()">Retry</button></div>`;
  }else{
    const wk=SCORE.week, t=SCORE.today;
    const pct=Math.max(0,Math.min(100,wk.pct*100));
    h+=`<div class="card"><div class="ttl">This week<span class="mono">${wk.net} / ${wk.max}</span></div>
     <div class="track"><div class="fill ${wk.unlocked?"f-band":"f-short"}" style="width:${pct}%"></div></div>
     <div class="note" style="margin-top:8px">${wk.unlocked
       ? "Reward unlocked."
       : Math.round(REWARD_THRESHOLD_PCT*100-pct)+"% to go."}
       Threshold is ${Math.round(REWARD_THRESHOLD_PCT*100)}% of the week, never a daily target —
       daily thresholds punish normal variance.</div>
     <div class="note" style="margin-top:8px;color:var(--ink2)">Reward is never food, never a cheat day.
       A purchase, a tracking-free day, gym kit.</div></div>`;

    if(t){
      h+=`<div class="card"><div class="ttl">Today's working<span class="mono">${t.net} net</span></div>
       ${t.lines.length? t.lines.map(l=>`<div class="row sp" style="padding:6px 0;border-bottom:1px solid var(--line)">
         <span style="font-size:13px">${esc(l.behaviour)}${l.detail?`<span class="sub">${esc(l.detail)}</span>`:""}</span>
         <span class="mono tiny" style="color:${l.pts>=0?"var(--teal)":"var(--amber)"}">${l.pts>0?"+":""}${l.pts}</span></div>`).join("")
        : `<div class="note">Nothing scored yet today.</div>`}
       ${t.lostRaw>NEG_CAP?`<div class="note" style="margin-top:9px">Raw losses ${t.lostRaw}, capped to ${NEG_CAP}.</div>`:""}
       <div class="note" style="margin-top:9px">Overeating is never scored against you. Points come from logging
        and protein — a big meal costs nothing, hiding it costs points.</div></div>`;
    }
  }

  /* Rolling compliance — replaces streaks entirely */
  h+=`<div class="card"><div class="ttl">Compliance<span class="mono">rolling, not streaks</span></div>
   ${[["Logged",r=>n(dv(r,SCHEMA.D.kcal))>0],
      ["Protein target",r=>n(dv(r,SCHEMA.D.p))>=145],
      ["Trained",r=>!!dv(r,SCHEMA.D.gymDone)],
      ["Water target",r=>n(dv(r,SCHEMA.D.water))>=WATER_TARGET],
      ["Sleep 7h+",r=>n(dv(r,SCHEMA.D.sleep))>=7],
      ["evening cutoff",r=>dv(r,SCHEMA.D.eveningCutoff)===true]]
   .map(([l,f])=>{const a14=adherence(14,f),a28=adherence(28,f);
     return `<div class="row sp" style="padding:7px 0;border-bottom:1px solid var(--line)">
      <span style="font-size:13.5px">${l}</span>
      <span class="mono tiny">${Math.round(a14/14*100)}% · 14d<span style="color:var(--muted)"> / ${Math.round(a28/28*100)}% · 28d</span></span></div>`}).join("")}
   <div class="note" style="margin-top:10px">A missed day nudges these numbers. Nothing resets to zero.</div></div>`;

  /* Gut pattern — stool-form criteria, denominator = abnormal-BM days only */
  const subtype=stoolFormSubtype();
  h+=`<div class="card tight"><div class="ttl">Gut pattern<span class="mono">${subtype.ready?subtype.totalDays+"d logged":"needs more data"}</span></div>
   ${subtype.ready
     ?`<div style="font-family:Archivo;font-size:15px;font-weight:600">${esc(subtype.subtype)}</div>
      <div class="note" style="margin-top:5px">${esc(subtype.note)}</div>`
     :`<div class="note">${esc(subtype.note)} (${subtype.daysLogged}/7 minimum)</div>`}
   <div class="note" style="margin-top:8px;color:var(--ink2)">Screening pattern only, not a diagnosis. Log Stool form on the Body tab.</div></div>`;

  /* tolerance Trigger Hypotheses — build order item 9 */
  h+=vIBSSection();

  /* Lab Result Explainer — build order item 8 */
  h+=vLabSection();

  /* Muscle volume — this week, from Lift Log */
  const mv=computeMuscleVolume();
  if(mv.length){
    h+=`<div class="card tight"><div class="ttl">Muscle volume this week<span class="mono">10\u201320 sets · \u22652 sessions</span></div>
     ${mv.map(r=>{
       const flag=r.sets<10||r.sessions<2?"UNDER":r.sets>20?"HIGH":"OK";
       const col=flag==="OK"?"var(--teal)":flag==="HIGH"?"var(--amber)":"var(--muted)";
       return `<div class="row sp" style="padding:6px 0;border-bottom:1px solid var(--line)">
        <span style="font-size:13px">${esc(r.group)}</span>
        <span class="mono tiny" style="color:${col}">${r.sets} sets · ${r.sessions}d · ${flag}</span></div>`;
     }).join("")}</div>`;
  }

  /* Supplement stock — reorder before running out */
  const low=SUPPLIES.filter(x=>{const f=String(dv(x,SCHEMA.SUP.flag)||"");return /REORDER|URGENT/i.test(f)});
  if(SUPPLIES.length){
    h+=`<div class="card"><div class="ttl">Supplement stock<span class="mono">${low.length} to reorder</span></div>
     ${low.length? low.map(x=>{
       const days=n(dv(x,SCHEMA.SUP.daysLeft)), urgent=/URGENT/i.test(String(dv(x,SCHEMA.SUP.flag)||""));
       const link=dv(x,SCHEMA.SUP.link);
       return `<div class="row sp" style="padding:8px 0;border-bottom:1px solid var(--line)">
        <span style="font-size:13.5px">${esc(dv(x,SCHEMA.SUP.name)||"")}
         <span class="sub" style="color:${urgent?"var(--amber)":"var(--muted)"}">${days?Math.floor(days)+" days left":"out"}</span></span>
        ${link?`<a class="btn sm" style="text-decoration:none" href="${esc(link)}" target="_blank" rel="noopener">Reorder</a>`:""}</div>`}).join("")
      : `<div class="note">Everything above threshold.</div>`}</div>`;
  }

  /* All pending actions — smart display: the soonest one shown plainly
     (matches the "one action" pattern on Today), the rest tucked behind
     a collapsible instead of a flat list that just produces deferral. */
  {

/* Field reader with a plausibility range. Previously any unparseable text
   ("seven point five" from voice, "n/a", a stray letter) became NaN, which
   JSON.stringify turns into null — so tapping Save WIPED the stored value
   and still showed "Saved ✓". Now it refuses and says which field. */
const FIELD_RANGES={
  f_weight:[30,250,"weight in kg"], f_total:[0,24,"sleep hours"],
  f_deep:[0,600,"deep sleep minutes"], f_rem:[0,600,"REM minutes"],
  f_awake:[0,600,"awake minutes"], f_onset:[0,600,"onset minutes"],
  f_steps:[0,100000,"steps"], f_spo2:[50,100,"SpO2 %"],
  f_spo2dips:[0,500,"dip count"], f_hrv:[1,400,"HRV in ms"],
  f_rhr:[25,220,"resting heart rate"], f_therapyh:[0,24,"Therapy hours"],
  f_dindex:[0,150,"device index"], f_bm:[0,30,"bowel movements"]
};
let BAD_FIELD=null;
function readField(id){
  const el=document.getElementById(id);
  const raw=el?String(el.value).trim():"";
  if(raw==="")return null;
  const v=parseFloat(raw.replace(/,/g,""));
  const rg=FIELD_RANGES[id];
  if(!isFinite(v)||(rg&&(v<rg[0]||v>rg[1]))){BAD_FIELD=rg?rg[2]:id;return undefined}
  return v;
}
function readGate(){ if(BAD_FIELD){toast("Check the "+BAD_FIELD+" — that doesn't look right",true);BAD_FIELD=null;return false} return true }

async function markAction(id,how){

/* ---------- Weekly Digest (build order item 6) ----------
   Nothing new is computed here — it rolls up SCORE, computeMuscleVolume(),
   adherence() and nextAction(), all of which already exist, into one
   block that reads like the DAILY SUMMARY format but for the week. */
function computeDigest(){
  const D=SCHEMA.D;
  /* Must be the last 7 CALENDAR days, not the last 7 rows. Daily Log rows
     only exist for days the app was opened, so slice(0,7) silently spanned
     three weeks for an intermittent user and then labelled it "this week".
     Worse, it made skipping days look GOOD: unopened days vanished from the
     denominator instead of counting as misses — the exact inversion of the
     "rolling rates, never streaks" rule this app is built on. */
  const today=new Date(localISO()+"T12:00:00");
  const wanted=[];
  for(let i=0;i<7;i++)wanted.push(localISO(new Date(today.getTime()-i*864e5)));
  const days=wanted.map(k=>HISTORY.find(h=>String(dv(h,D.date)||"").slice(0,10)===k)).filter(Boolean);
  if(!days.length)return null;
  const TOTAL_DAYS=7;
  const withKcal=days.filter(h=>n(dv(h,D.kcal))>0);
  const weights=days.map(h=>n(dv(h,D.weight))).filter(Boolean);
  const trained=days.filter(h=>!!dv(h,D.gymDone)).length;
  const deepVals=days.map(h=>n(dv(h,D.deep))).filter(v=>v>0);
  const sleepVals=days.map(h=>n(dv(h,D.sleep))).filter(v=>v>0);
  const AT_T=adaptiveTargets();
  const proteinHit=withKcal.filter(h=>n(dv(h,D.p))>=AT_T.proteinLo).length;
  const floorHit=withKcal.filter(h=>n(dv(h,D.kcal))>=AT_T.kcalLo).length;
  const cutoffHeld=days.filter(h=>dv(h,D.eveningCutoff)===true).length;
  const mv=computeMuscleVolume();
  const under=mv.filter(r=>r.sets<10||r.sessions<2).map(r=>r.group);
  const openTop=nextAction();
  const lowSupp=SUPPLIES.filter(x=>/REORDER|URGENT/i.test(String(dv(x,SCHEMA.SUP.flag)||"")));
  return {
    range:[wanted[wanted.length-1],wanted[0]],
    daysLogged:withKcal.length, totalDays:TOTAL_DAYS,
    weightStart:weights.length?weights[weights.length-1]:null, weightEnd:weights.length?weights[0]:null,
    trained,
    deepAvg:deepVals.length?Math.round(deepVals.reduce((a,b)=>a+b,0)/deepVals.length):null,
    sleepAvg:sleepVals.length?r1(sleepVals.reduce((a,b)=>a+b,0)/sleepVals.length):null,
    proteinHitRate:withKcal.length?Math.round(proteinHit/withKcal.length*100):null,
    floorHitRate:withKcal.length?Math.round(floorHit/withKcal.length*100):null,
    cutoffHeld, scoreNet:SCORE.week?SCORE.week.net:null, scoreMax:SCORE.week?SCORE.week.max:null,
    underVolume:under, openTopText:openTop?dv(openTop,SCHEMA.A.action):null, lowSuppCount:lowSupp.length
  };
}
function digestText(d){
  if(!d)return "";
  const wDelta=(d.weightEnd!=null&&d.weightStart!=null)?r1(d.weightEnd-d.weightStart):null;
  const lines=[
    `Logged ${d.daysLogged}/${d.totalDays} days`,
    d.weightEnd!=null?`Weight ${d.weightEnd}kg${wDelta!=null?` (${wDelta>0?"+":""}${wDelta}kg this week)`:""}`:`Weight: not logged`,
    `Gym ${d.trained}/${d.totalDays} sessions${d.underVolume.length?` — under volume: ${d.underVolume.join(", ")}`:""}`,
    `Sleep ${d.sleepAvg??"—"}h avg · deep ${d.deepAvg??"—"}min avg`,
    `Calorie floor hit ${d.floorHitRate??"—"}% · protein target hit ${d.proteinHitRate??"—"}%`,
    `evening cutoff held ${d.cutoffHeld}/${d.totalDays} days`,
    d.scoreMax?`Score ${d.scoreNet}/${d.scoreMax}`:``,
    d.openTopText?`Top open action: ${d.openTopText}`:``,
    d.lowSuppCount?`Supplements to reorder: ${d.lowSuppCount}`:``
  ].filter(Boolean);
  return lines.join("\n");
}
async function copyDigest(){

/* ---------- weekly review ritual ----------
   The digest engine already existed but nothing ever ASKED for it, so it
   was a report nobody ran. A dashboard you have to remember to consult is
   a dashboard you stop consulting. This makes it a prompted, closeable
   loop: it appears once a week, proposes exactly ONE change, and then
   gets out of the way until next week.
   One change, not a list — a list is how a review becomes homework. */
const REVIEW_KEY=SKEY("last_review");
let LAST_REVIEW="";
async function loadReviewState(){try{LAST_REVIEW=(await Store.get(REVIEW_KEY))||""}catch(e){LAST_REVIEW=""}}
async function markReviewed(){
  LAST_REVIEW=localISO();
  try{await Store.set(REVIEW_KEY,LAST_REVIEW)}catch(e){}
  sheet=null;toast("Week closed out ✓");R();
}
/* Due on Sunday, or any time it's been 7+ days since the last one — so a
   missed Sunday rolls forward instead of silently skipping a week. */
function reviewDue(){
  if(state!=="ready")return false;
  const today=localISO();
  if(LAST_REVIEW===today)return false;
  const isSunday=new Date(today+"T12:00:00").getDay()===0;
  // First ever review: don't sit invisible for up to six days waiting for a
  // Sunday — once there's a week of history there's something worth reading,
  // and that's the moment to introduce the ritual.
  if(!LAST_REVIEW)return isSunday||HISTORY.length>=7;
  const gap=(new Date(today)-new Date(LAST_REVIEW))/864e5;
  return isSunday||gap>=7;
}
/* Deterministic, ordered by leverage — the weakest fundamental wins.
   Consistency beats optimisation, so "log at all" outranks "hit protein",
   which outranks anything cosmetic. */
function weeklyOneChange(d){
  if(!d)return {focus:"Log tomorrow",why:"There isn't enough logged this week to read a pattern. One logged day restarts the signal."};
  if(d.daysLogged<=4)return {focus:"Log every day next week, even badly",
    why:`Only ${d.daysLogged}/${d.totalDays} days had food logged. Every other number here is unreliable until that's fixed — this is the one that unlocks the rest.`};
  if(d.trained<2)return {focus:"Get two sessions in, not four",
    why:`${d.trained} session${d.trained===1?"":"s"} this week. Two is the minimum that retains muscle; aiming for four and hitting one is worse than aiming for two and hitting two.`};
  if(d.sleepAvg!=null&&d.sleepAvg<6.5)return {focus:"Protect a 7h sleep window",
    why:`Averaging ${d.sleepAvg}h. Below ~6.5h, appetite regulation and training recovery both degrade — this is upstream of the weight and the gym numbers.`};
  if(d.floorHitRate!=null&&d.floorHitRate<60)return {focus:"Eat to the calorie floor",
    why:`Floor hit only ${d.floorHitRate}% of logged days. Under-eating on a recomp costs muscle and makes the evening binge more likely, not less.`};
  if(d.proteinHitRate!=null&&d.proteinHitRate<60)return {focus:"Anchor protein at breakfast",
    why:`Protein target hit ${d.proteinHitRate}% of days. Front-loading it removes the 9pm scramble to find 60g.`};
  if(d.underVolume&&d.underVolume.length)return {focus:`Add a set for ${d.underVolume[0]}`,
    why:`${d.underVolume.join(", ")} sat under the 10-set weekly band. One extra set per session closes that without adding a workout.`};
  if(d.cutoffHeld<d.totalDays-1)return {focus:"Hold the 9pm cutoff",
    why:`Cutoff held ${d.cutoffHeld}/${d.totalDays} days. This one's a straight consistency play — nothing to optimise, just the rule.`};
  return {focus:"Change nothing — repeat this week",
    why:"Everything fundamental is in band. The highest-value move now is another week exactly like this one, not a new variable."};
}
function vWeeklyReview(){
  const d=computeDigest();
  const change=weeklyOneChange(d);
  const wDelta=(d&&d.weightEnd!=null&&d.weightStart!=null)?r1(d.weightEnd-d.weightStart):null;
  const row=(label,val,tone)=>`<div class="row sp" style="padding:7px 0;border-bottom:1px solid var(--line)">

   <div class="sheet">

    ${d?`
    ${row("Days logged",`${d.daysLogged}/${d.totalDays}`,d.daysLogged>=5?"var(--teal)":"var(--amber)")}
    ${row("Weight",d.weightEnd!=null?`${d.weightEnd}kg${wDelta!=null?` (${wDelta>0?"+":""}${wDelta})`:""}`:"not logged")}
    ${row("Gym sessions",`${d.trained}/${d.totalDays}`,d.trained>=3?"var(--teal)":"var(--amber)")}
    ${row("Sleep avg",d.sleepAvg!=null?d.sleepAvg+"h":"—",(d.sleepAvg||0)>=7?"var(--teal)":"var(--amber)")}
    ${row("Protein target",d.proteinHitRate!=null?d.proteinHitRate+"%":"—",(d.proteinHitRate||0)>=60?"var(--teal)":"var(--amber)")}
    ${row("Calorie floor",d.floorHitRate!=null?d.floorHitRate+"%":"—",(d.floorHitRate||0)>=60?"var(--teal)":"var(--amber)")}
    ${row("9PM cutoff held",`${d.cutoffHeld}/${d.totalDays}`)}
    `:`<div class="note">Not enough logged this week to build a picture yet.</div>`}

    <div class="card tight" style="margin-top:13px;background:var(--surface2)">
     <div class="ttl">One change for next week</div>
     <div style="font-family:Archivo;font-size:16px;font-weight:600;margin-bottom:6px">${esc(change.focus)}</div>
     <div class="note">${esc(change.why)}</div></div>

    <button class="btn p full" style="margin-top:11px" onclick="markReviewed()">Close out the week</button>

   </div></div>`;

/* ---------- check-in voice (build order item 7, Body tab) ----------
   Deterministic regex extraction — values are stated directly ("weight
   86.2", "deep sleep 50 min"), so there's no macro-estimation problem the
   way there is for food. This only fills the visible form fields; each
   section's own Save button is still what actually writes to Airtable —
   voice never skips the confirm-before-write rule.                      */
function numAfter(raw,re){const m=raw.match(re);return m?parseFloat(m[1]):null}
function parseCheckinVoice(raw){
  /* Strip digit-group commas FIRST. Chrome's speech recognition emits
     "8,000 steps", and /(\d+)\s*steps/ matched only the trailing "000" —
     so a target-hitting day was filled in as 0 steps, silently, because 0
     passes an isFinite() guard. */
  const t=" "+raw.toLowerCase().replace(/(\d),(?=\d{3}\b)/g,"$1")+" ";
  /* "deep sleep 1 hour 20 min" is how most wearables report it. The old
     minutes-only regex couldn't span it and fell through to a loose
     fallback that grabbed the "1" — writing 1 minute of deep sleep AND
     1 hour of total sleep from the same phrase. */
  const hoursMins=(label)=>{
    const m=t.match(new RegExp(label+"\\D{0,10}(\\d+)\\s*h\\w*(?:\\s*(\\d+)\\s*m)?"));
    return m?(parseFloat(m[1])*60+(m[2]?parseFloat(m[2]):0)):null;
  };
  return {
    weight: numAfter(t,/weight\D{0,5}(\d+(?:\.\d+)?)/) ?? numAfter(t,/(\d+(?:\.\d+)?)\s*kg\b/),
    /* "(?<!deep )" matters: "deep sleep 1 hour 20 min" was ALSO matching the
       total-sleep pattern, so one phrase wrote 1h total sleep as well as the
       deep figure — two corrupted fields from one sentence. */
    sleepTotal: numAfter(t,/(?:slept|total sleep|(?<!deep )(?<!rem )sleep)\D{0,8}(\d+(?:\.\d+)?)\s*h/) ?? numAfter(t,/(\d+(?:\.\d+)?)\s*hours?\s*(?:of\s*)?sleep/),
    deep: hoursMins("deep") ?? numAfter(t,/deep\D{0,8}(\d+)\s*min/),
    rem: hoursMins("rem") ?? numAfter(t,/rem\D{0,8}(\d+)\s*min/),
    awake: hoursMins("awake") ?? numAfter(t,/awake\D{0,8}(\d+)\s*min/),
    onset: numAfter(t,/onset\D{0,8}(\d+)\s*min/) ?? numAfter(t,/(\d+)\s*min\w*\s*to\s*fall\s*asleep/),
    steps: numAfter(t,/(\d+)\s*steps/),
    spo2: numAfter(t,/spo2\D{0,5}(\d+)/) ?? numAfter(t,/oxygen\D{0,5}(\d+)/),
    spo2Dips: numAfter(t,/(\d+)\s*dips?/),
    hrv: numAfter(t,/hrv\D{0,5}(\d+)/),
    rhr: numAfter(t,/(?:resting heart rate|rhr)\D{0,5}(\d+)/)
  };
}
function applyCheckinVoice(){
  const el=document.getElementById("checkinvoice");
  const raw=(el&&el.value||"").trim();
  if(!raw){toast("Say or type the check-in first",true);return}
  const p=parseCheckinVoice(raw);
  const set=(id,v)=>{if(v==null||!isFinite(v))return false;const e=document.getElementById(id);if(e){e.value=v;return true}return false};
  let filled=0;
  [["f_weight",p.weight],["f_total",p.sleepTotal],["f_deep",p.deep],["f_rem",p.rem],["f_awake",p.awake],
   ["f_onset",p.onset],["f_steps",p.steps],["f_spo2",p.spo2],["f_spo2dips",p.spo2Dips],["f_hrv",p.hrv],["f_rhr",p.rhr]]
   .forEach(([id,v])=>{if(set(id,v))filled++});
  window._voice=Object.assign(window._voice||{},{checkinvoice:""});
  if(el)el.value="";
  toast(filled?`Filled ${filled} field${filled===1?"":"s"} — tap Save on each section`:'Couldn\'t make out any values — try "weight 86.2, slept 7.5 hours"',!filled);
  R();
}

/* ---------- Lab Result Explainer (build order item 8) ----------
   The base already carries 100+ well-annotated Lab Results rows with real
   clinician-grade notes — this reads and explains that data rather than
   re-deriving it. Priority markers get an explicit check against the
   Phase 2 (12-week) retest targets from the Long-Term Plan. */
// Personal retest goals per marker, e.g. {"LDL Cholesterol":{goal:115,dir:"below"}}.
// Empty by default — reference ranges still come from the lab, via Airtable.
const LAB_TARGETS=(window.ABOS_CONFIG&&window.ABOS_CONFIG.labTargets)||{};
function labMarkerGroups(){
  const byMarker={};
  LAB_RESULTS.forEach(r=>{
    const m=dv(r,SCHEMA.LR.marker); if(!m)return;
    (byMarker[m]=byMarker[m]||[]).push(r);
  });
  Object.values(byMarker).forEach(arr=>arr.sort((a,b)=>String(dv(b,SCHEMA.LR.date)||"").localeCompare(String(dv(a,SCHEMA.LR.date)||""))));
  return byMarker;
}
function vLabSection(){
  if(!LAB_RESULTS.length)return "";
  const groups=labMarkerGroups();
  /* Markers are ordered by how much they matter to you, not alphabetically —
     the first few rows are what you actually look at. Supply your own order
     in config; anything not listed is simply not shown. */
  const priority=(window.ABOS_CONFIG&&window.ABOS_CONFIG.labPriority)||
    Object.keys(groups).sort();
  const statusColor=s=>({Optimal:"var(--teal)",Normal:"var(--teal)",Borderline:"var(--gold)",High:"var(--amber)",Low:"var(--amber)",Critical:"var(--amber)"}[s]||"var(--muted)");
  const rows=priority.filter(m=>groups[m]).map(m=>{
    const [latest,prev]=groups[m];
    const val=n(dv(latest,SCHEMA.LR.value)), unit=dv(latest,SCHEMA.LR.unit)||"";
    const status=dv(latest,SCHEMA.LR.status)||"";
    const date=dv(latest,SCHEMA.LR.date);
    const notes=dv(latest,SCHEMA.LR.notes)||"";
    const target=LAB_TARGETS[m];
    let targetLine="";
    if(target){
      let met;
      if(target.dir==="below")met=val<target.goal;
      else if(target.dir==="above")met=val>target.goal;
      else met=val>=target.goal[0]&&val<=target.goal[1];
      const goalTxt=target.dir==="range"?`${target.goal[0]}–${target.goal[1]}`:(target.dir==="below"?"<"+target.goal:">"+target.goal);
      targetLine=`<div class="tiny" style="margin-top:2px;color:${met?"var(--teal)":"var(--amber)"}">Phase 2 target ${goalTxt} — ${met?"met":"not yet met"}</div>`;
    }
    let trend="";
    if(prev){
      const pv=n(dv(prev,SCHEMA.LR.value));
      if(pv&&val!==pv)trend=` <span class="tiny" style="color:var(--muted)">(${val>pv?"↑":"↓"} from ${pv} on ${esc(String(dv(prev,SCHEMA.LR.date)||"").slice(0,10))})</span>`;
    }
    return `<div style="padding:8px 0;border-bottom:1px solid var(--line)">
      <div class="row sp"><span style="font-size:13.5px">${esc(m)}</span>
       <span class="mono tiny" style="color:${statusColor(status)}">${val}${esc(unit)} · ${esc(status)}</span></div>
      <div class="tiny" style="color:var(--muted);margin-top:2px">${esc(String(date||"").slice(0,10))}${trend}</div>
      ${targetLine}
      ${notes?`<div class="note" style="margin-top:4px">${esc(notes)}</div>`:""}
    </div>`;
  }).join("");
  return `<div class="card tight"><div class="ttl">Lab result explainer<span class="mono">${LAB_RESULTS.length} markers · ${LAB_PANELS.length} panels</span></div>
   ${rows||`<div class="note">No priority markers logged yet.</div>`}
   <div class="note" style="margin-top:9px;color:var(--ink2)">Screening reference only — never a diagnosis. Route anything flagged to your GP or specialist.</div></div>`;
}

/* ---------- tolerance Trigger Hypotheses (build order item 9) ----------
   Correlational, not causal, and says so. Requires a minimum number of
   logged flare days before it claims anything beyond the already-
   confirmed trigger list from the OS reference, and confidence never
   goes above MEDIUM here — this is a small-N pattern engine, not a lab. */
const KNOWN_TRIGGERS=[
  {tag:"Legume at dinner",test:f=>/dal|daal|rajma|chana|chole|sattu|lentil|sambar/i.test(String(dv(f,SCHEMA.F.item)||""))&&String(dv(f,SCHEMA.F.meal)||"")==="Dinner"},
  {tag:"Tolerance-flagged item (Trigger)",test:f=>String(dv(f,SCHEMA.F.tol)||"")==="Trigger"},
  {tag:"Tolerance-flagged item (Caution)",test:f=>String(dv(f,SCHEMA.F.tol)||"")==="Caution"},
  {tag:"More than 1 grain that day",test:null}, // per-day, handled via dayTest below
  {tag:"Whey / protein shake",test:f=>/whey|isolate|scoop/i.test(String(dv(f,SCHEMA.F.item)||""))},
  {tag:"Fried / deep-fried",test:f=>/fried|pakora|samosa|vada|bhatura|puri/i.test(String(dv(f,SCHEMA.F.item)||""))},
  {tag:"Cream / malai gravy",test:f=>/malai|cream|makhani|korma|kaju|shahi/i.test(String(dv(f,SCHEMA.F.item)||""))}
];
function computeIBSHypotheses(){
  const D=SCHEMA.D;
  const byDate={};
  HISTORY.forEach(h=>{const d=String(dv(h,D.date)||"").slice(0,10);if(d)byDate[d]=h});
  const bloatRank={None:0,Mild:1,Moderate:2,Severe:3};
  const flareDates=[],quietDates=[];
  Object.keys(byDate).forEach(d=>{
    const rank=bloatRank[dv(byDate[d],D.bloat)];
    if(rank===undefined)return; // Bloating not logged that day — excluded, not counted as "quiet"
    if(rank>=2)flareDates.push(d); else quietDates.push(d);
  });
  if(flareDates.length<3){
    return {ready:false,flareDays:flareDates.length,
      note:"Only "+flareDates.length+" Moderate/Severe bloating day"+(flareDates.length===1?"":"s")+" logged so far — need at least 3 before a pattern is meaningful."};
  }
  /* Without quiet days there is nothing to contrast against: every trigger's
     quietRate is 0, so diff == flareRate and ordinary daily food (roti,
     dal) ranks as the top "trigger" purely because it's eaten every day.
     A comparison needs both sides. */
  if(quietDates.length<3){
    return {ready:false,flareDays:flareDates.length,
      note:"Only "+quietDates.length+" low-bloating day"+(quietDates.length===1?"":"s")+" logged — without quiet days to compare against, everything you eat daily looks like a trigger."};
  }
  const foodsByDate={};
  ALLFOODS.forEach(f=>{const d=String(dv(f,SCHEMA.F.date)||"").slice(0,10);if(d)(foodsByDate[d]=foodsByDate[d]||[]).push(f)});
  const grainsByDate={};
  Object.keys(byDate).forEach(d=>grainsByDate[d]=n(dv(byDate[d],D.grain)));

  const rate=(dates,testFn,dayTest)=>{
    let hit=0,total=dates.length;
    dates.forEach(d=>{
      if(dayTest){if(dayTest(d))hit++;return}
      if((foodsByDate[d]||[]).some(testFn))hit++;
    });
    return total?hit/total:0;
  };
  const results=KNOWN_TRIGGERS.map(t=>{
    const dayTest = t.tag==="More than 1 grain that day" ? (d=>grainsByDate[d]>1) : null;
    const flareRate=rate(flareDates,t.test,dayTest);
    const quietRate=rate(quietDates,t.test,dayTest);
    return {tag:t.tag,flareRate,quietRate,diff:flareRate-quietRate};
  }).filter(r=>r.flareRate>0).sort((a,b)=>b.diff-a.diff);

  return {ready:true,flareDays:flareDates.length,quietDays:quietDates.length,
    confidence: flareDates.length>=10?"MEDIUM":"LOW", results:results.slice(0,4)};
}
function vIBSSection(){
  const h=computeIBSHypotheses();
  if(!h.ready){
    return `<div class="card tight"><div class="ttl">Trigger hypotheses<span class="mono">${h.flareDays}/3 flare days</span></div>
     <div class="note">${esc(h.note)} </div></div>`;
  }
  return `<div class="card tight"><div class="ttl">Trigger hypotheses<span class="mono">${h.confidence} confidence · ${h.flareDays} flare days</span></div>
   ${h.results.length?h.results.map(r=>`<div class="row sp" style="padding:6px 0;border-bottom:1px solid var(--line)">
     <span style="font-size:13px">${esc(r.tag)}</span>
     <span class="mono tiny">${Math.round(r.flareRate*100)}% of flares vs ${Math.round(r.quietRate*100)}% of quiet days</span></div>`).join("")
    :`<div class="note">No candidate shows up more often on flare days than quiet days yet.</div>`}
   <div class="note" style="margin-top:9px;color:var(--ink2)">Correlational, not a diagnosis — a pattern worth watching, not a confirmed cause. Route anything persistent to a GP.</div></div>`;
}

/* Framework attribution. Subtle, non-interactive, sits below the nav.
   Please leave this in place — see ATTRIBUTION.md and the licence's
   Required Notice. It never carries a personal email address. */
/* About / Credits. Names the user's app, states plainly that it runs on
   the AbhinavOS framework, and carries the medical disclaimer. Collapsed
   by default so it never competes with the day's actual content. */
/* Emits a ready-made config.js from whatever the wizard captured. Useful
   on its own, and specifically useful for handing to Claude when someone
   wants help going beyond what the wizard covers. */
function exportConfig(){
  const s=SETUP||{};
  const q=v=>JSON.stringify(v);
  const L=[];
  L.push("/* Generated by the "+FRAMEWORK_NAME+" Setup Wizard.");
  L.push("   Save this as app/config.js. It is gitignored by default.");
  L.push("   API keys are NOT here — they stay in your browser. */");
  L.push("window.ABOS_CONFIG = {");
  L.push("  branding: {");
  ["appName","tagline","displayName","faceImage"].forEach(k=>{
    if(s[k])L.push("    "+k+": "+q(s[k])+",");
  });
  L.push("  },");
  if(s.primary||s.ground){
    L.push("  theme: {");
    if(s.primary)L.push("    primary: "+q(s.primary)+",");
    if(s.ground)L.push("    ground: "+q(s.ground)+",");
    L.push("  },");
  }
  L.push("  profile: {");
  ["heightCm","ageYears","startingWeightKg"].forEach(k=>{ if(s[k])L.push("    "+k+": "+Number(s[k])+","); });
  if(s.sex)L.push("    sex: "+q(s.sex)+",");
  L.push("  },");
  L.push("  targets: {");
  [["kcalFloor","kcalFloor"],["waterLitres","waterLitres"],["proteinPerKg","proteinPerKg"]]
    .forEach(([k,o])=>{ if(s[k])L.push("    "+o+": "+Number(s[k])+","); });
  L.push("  },");
  if(s.baseId)L.push("  baseId: "+q(s.baseId)+",");
  if(s.dietHint)L.push("  dietHint: "+q(s.dietHint)+",");
  L.push("};");
  const text=L.join("\n");
  try{
    navigator.clipboard.writeText(text);
    alert("config.js copied to your clipboard.\n\nSave it as app/config.js, or paste it to Claude if you want help going further.");
  }catch(e){
    prompt("Copy this and save it as app/config.js:", text);
  }
}

const TABS=[["today",I_TODAY,"Today"],["food",I_FOOD,"Food"],["gym",I_GYM,"Gym"],["body",I_BODY,"Body"],["stats",I_STATS,"Stats"]];

  const el=document.getElementById("nl");if(el)window._nl=el.value;
  ["gymvoice","checkinvoice"].forEach(id=>{const e2=document.getElementById(id);if(e2){window._voice=window._voice||{};window._voice[id]=e2.value}});
  const cq=document.getElementById("coachq");if(cq)window._coachq=cq.value;

  // read straight from DAILY, which doesn't update until a save round-trip

  // instant Save was tapped (looked like the tap did nothing).
  ["f_weight","f_total","f_deep","f_rem","f_awake","f_onset","f_steps","f_spo2","f_spo2dips","f_hrv","f_rhr","f_therapyh","f_dindex","f_bm"]
    .forEach(id=>{const e3=document.getElementById(id);if(e3){window._body=window._body||{};window._body[id]=e3.value}});
  if(Store.mode()==="memory"&&!window._warnedMem){window._warnedMem=1;

const demoBar = DEMO
    ? '<div class="card" style="border-color:var(--gold);background:rgba(236,154,62,.09);padding:10px 12px;margin-bottom:10px">'

      +'<button class="btn sm p" style="margin-top:8px" onclick="exitDemo()">Set up my own</button></div>'
    : "";
  const offlineBar = (!navigator.onLine || WRITE_QUEUE.length)

     `<div class="lvl" style="color:${SYNC==="error"?"var(--amber)":"var(--muted)"}">${SYNC==="working"?'<span class="spin"></span>':""}</div>`}</header>`;
