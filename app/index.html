  window._body.f_therapyused=!therapyChecked();
  R();
}

/* ---------- progress photos ----------
   The stated goal is visual — clothing fit, face definition, presence.
   Scale weight swings ±0.5kg on water alone and will demoralise before it
   motivates; a monthly photo is the metric that actually matches the goal
   and it's the one almost everyone skips because it's mildly unpleasant.
   Resized client-side so a 4MB phone photo doesn't blow Airtable's 5MB
   attachment ceiling or the upload budget. */
function resizeImage(file,maxPx=1280,quality=0.82){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onerror=()=>reject(new Error("Couldn't read that image"));
    fr.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("Couldn't decode that image"));
      img.onload=()=>{
        let {width:w,height:hh}=img;
        const scale=Math.min(1,maxPx/Math.max(w,hh));
        w=Math.round(w*scale); hh=Math.round(hh*scale);
        const c=document.createElement("canvas"); c.width=w; c.height=hh;
        c.getContext("2d").drawImage(img,0,0,w,hh);
        const dataUrl=c.toDataURL("image/jpeg",quality);
        resolve(dataUrl.split(",")[1]);
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
/* ---------- local thumbnail cache ----------
   Airtable attachment download URLs live on airtableusercontent.com and
   are only guaranteed valid for ~2 hours. This app caches the Daily Log
   for 2 hours, so relying on those URLs would mean the photo grid
   silently rendered broken images most of the time — and re-fetching to
   refresh them would spend API calls on a 1,000/month budget just to look
   at a picture.
   So: a small thumbnail is kept locally at upload time and is what the UI
   actually displays. Airtable holds the full-resolution original as the
   durable archive. Displaying photos therefore costs ZERO API calls,
   works offline, and can't break when a URL expires. */
const PHOTO_THUMB_KEY=SKEY("photo_thumbs");
const PHOTO_THUMB_MAX=24; // ~2 years at the recommended monthly cadence
let PHOTO_THUMBS={};
async function loadPhotoThumbs(){
  try{const v=await Store.get(PHOTO_THUMB_KEY);PHOTO_THUMBS=v?JSON.parse(v):{}}catch(e){PHOTO_THUMBS={}}
}
async function savePhotoThumbs(){
  const trim=(keep)=>{const ds=Object.keys(PHOTO_THUMBS).sort();while(ds.length>keep)delete PHOTO_THUMBS[ds.shift()]};
  trim(PHOTO_THUMB_MAX);
  try{await Store.set(PHOTO_THUMB_KEY,JSON.stringify(PHOTO_THUMBS))}
  catch(e){
    // Storage quota — keep the most recent handful rather than losing all.
    trim(6);
    try{await Store.set(PHOTO_THUMB_KEY,JSON.stringify(PHOTO_THUMBS))}catch(e2){}
  }
}

/* Attachment uploads go to content.airtable.com, a different host from the
   REST API, so this can't route through at() — including its offline
   queue. A photo is deliberately NOT queued: base64 image data would bloat
   local storage badly, and a progress photo is never urgent.
   Cost: exactly one API call per photo. */
async function uploadPhoto(input){
  const file=input&&input.files&&input.files[0];
  if(!file)return;
  if(!TODAY_ID){toast("Today's record isn't ready yet",true);return}
  if(!navigator.onLine){toast("Photos need a connection — try again when online",true);input.value="";return}
  SYNC="working";R();
  try{
    const b64=await resizeImage(file,1280,0.82);   // archive copy → Airtable
    const thumb=await resizeImage(file,420,0.72);  // display copy → stays on this device
    trackApiCall();
    const res=await fetch(`https://content.airtable.com/v0/${BASE}/${TODAY_ID}/${SCHEMA.D.photos}/uploadAttachment`,{
      method:"POST",
      headers:{"Authorization":"Bearer "+TOKEN,"Content-Type":"application/json"},
      body:JSON.stringify({contentType:"image/jpeg",file:b64,filename:`progress-${localISO()}.jpg`})
    });
    if(!res.ok){
      const t=await res.text();
      throw new Error(t.slice(0,140)||("HTTP "+res.status));
    }
    const j=await res.json();
    if(j&&j.fields&&SCHEMA.D.photos&&j.fields[SCHEMA.D.photos]) DAILY[SCHEMA.D.photos]=j.fields[SCHEMA.D.photos];
    const k=localISO();
    (PHOTO_THUMBS[k]=PHOTO_THUMBS[k]||[]).push("data:image/jpeg;base64,"+thumb);
    await savePhotoThumbs();
    SYNC="idle"; toast("Photo saved ✓ +20 XP");
  }catch(e){
    SYNC="error"; lastError=(e&&e.message)||String(e);
    toast("Photo upload failed",true);
  }
  if(input)input.value="";
  R();
}
/* Local thumbnails win over Airtable URLs for display, because the remote
   ones may already have expired. Remote entries are still included for
   dates this device has no local copy of (e.g. photos taken on a phone
   and viewed on a laptop) — those may or may not still resolve, which is
   exactly why the local copy is preferred when it exists. */
function photoHistory(){
  const D=SCHEMA.D, out=[], localDates={};
  Object.keys(PHOTO_THUMBS).forEach(date=>{
    (PHOTO_THUMBS[date]||[]).forEach(url=>out.push({date,url,local:true}));
    localDates[date]=true;
  });
  const addRemote=(rec,date)=>{
    if(!date||localDates[date])return;
    const ph=dv(rec,D.photos);
    if(!ph||!ph.length)return;
    ph.forEach(p=>{
      const u=(p.thumbnails&&p.thumbnails.large&&p.thumbnails.large.url)||p.url;
      if(u&&!out.some(x=>x.url===u))out.push({date,url:u,local:false});
    });
  };
  HISTORY.forEach(h=>addRemote(h,String(dv(h,D.date)||"").slice(0,10)));
  addRemote(DAILY,localISO());
  return out.filter(x=>x.url).sort((a,b)=>b.date.localeCompare(a.date));
}
function vPhotoSheet(){
  const ph=photoHistory();
  const newest=ph[0], oldest=ph[ph.length-1];
  return `<div class="scrim" onclick="if(event.target===this){sheet=null;R()}">
   <div class="sheet">
    <div class="grip"></div>
    <div class="ttl">Progress photos<span class="mono">${ph.length} saved</span></div>
    ${ph.length>=2?`
     <div class="row" style="gap:8px">
      <div class="grow" style="text-align:center">
       <div class="tiny mono" style="margin-bottom:5px;color:var(--muted)">${esc(oldest.date)}</div>
       <img src="${esc(oldest.url)}" alt="earliest progress photo" style="width:100%;border-radius:12px;border:1px solid var(--line)"></div>
      <div class="grow" style="text-align:center">
       <div class="tiny mono" style="margin-bottom:5px;color:var(--gold)">${esc(newest.date)}</div>
       <img src="${esc(newest.url)}" alt="latest progress photo" style="width:100%;border-radius:12px;border:1px solid var(--gold)"></div>
     </div>
     <div class="note" style="margin-top:10px">${daysBetween(oldest.date,newest.date)} days apart. Same light, same time of day, same pose is what makes these comparable.</div>`
    :`<div class="note">Add at least two photos to see a comparison. One a month is plenty — weekly is too often to show change.</div>`}
    ${ph.length?`<div class="photogrid">${ph.map(p=>`<img src="${esc(p.url)}" alt="progress photo ${esc(p.date)}" loading="lazy">`).join("")}</div>`:""}
    <button class="btn full" style="margin-top:12px" onclick="sheet=null;R()">Close</button>
   </div></div>`;
}

/* HRV explains only ~1–2% of variance in perceived stress — this is a
   low-confidence trend input, never a verdict. 7-day mean vs 28-day
   baseline, flagged only when the recent mean sits over 1 SD below. */
function hrvDeviation(){
  const D=SCHEMA.D;
  const vals28=[], vals7=[];
  const today=new Date(localISO()+"T12:00:00");
  for(let i=0;i<28;i++){
    const k=localISO(new Date(today.getTime()-i*864e5));
    const h=HISTORY.find(x=>String(dv(x,D.date)||"").slice(0,10)===k);
    const v=h?n(dv(h,D.hrv)):null;
    if(v){vals28.push(v); if(i<7)vals7.push(v)}
  }
  if(vals28.length<10 || vals7.length<3) return null; // not enough data for a stable baseline
  const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;
  /* Compare the last 7 days against the PRIOR 21, not against a 28-day
     window that contains those same 7 days. Including the sample in its own
     baseline drags the mean toward it and systematically understates the
     deviation — the flag fired late, or not at all. */
  const prior=vals28.slice(7);
  const base=prior.length>=7?prior:vals28;
  const m28=mean(base), m7=mean(vals7);
  const sd=Math.sqrt(base.reduce((s,x)=>s+(x-m28)*(x-m28),0)/base.length);
  if(sd===0) return null;
  const dev=(m7-m28)/sd;
  if(dev < -1){
    return {low:true, m7:Math.round(m7), m28:Math.round(m28),
      note:"7-day HRV running below your 28-day baseline. Low-confidence trend signal only — not a verdict."};
  }
  return null;
}

/* stool-form criteria tolerance-M subtyping. HARD RULE, the part almost everyone gets
   wrong: the >25% hard AND >25% loose thresholds are computed over
   ABNORMAL bowel-movement days only (Stool-form 1-2 or 6-7), not all days.
   A normal-BM day contributes to neither the numerator nor denominator. */
function stoolFormSubtype(){
  const D=SCHEMA.D;
  const today=new Date(localISO()+"T12:00:00");
  let hard=0, loose=0, abnormal=0, totalDays=0;
  for(let i=0;i<14;i++){
    const k=localISO(new Date(today.getTime()-i*864e5));
    const h=HISTORY.find(x=>String(dv(x,D.date)||"").slice(0,10)===k);
    const b=h?String(dv(h,D.stoolForm)||""):"";
    if(!b) continue;
    totalDays++;
    const score=parseInt(b,10);
    if(score<=2){hard++;abnormal++}
    else if(score>=6){loose++;abnormal++}
  }
  if(totalDays<7) return {ready:false, daysLogged:totalDays, note:"Log Stool form for at least a 14-day window (7 minimum) for a reliable read."};
  if(abnormal===0) return {ready:true, subtype:"Insufficient abnormal days", hard,loose,abnormal,totalDays};
  const hardPct=hard/abnormal, loosePct=loose/abnormal;
  let subtype;
  if(hardPct>0.25 && loosePct>0.25) subtype="Mixed";
  else if(hardPct>0.25) subtype="Constipation-leaning (constipation-predominant)";
  else if(loosePct>0.25) subtype="Loose-leaning (diarrhoea-predominant)";
  else subtype="Neither threshold met on current data";
  return {ready:true, subtype, hard, loose, abnormal, totalDays,
    note:"Denominator is abnormal-BM days only ("+abnormal+" of "+totalDays+" logged), per stool-form criteria."};
}

/* Muscle Volume Weekly — computed from Lift Log and written to the table
   that already exists in Airtable. 1–3 RIR working sets only; indirect
   sets count 0.5; target band is 10–20 sets at >=2 sessions/week. */
function isoWeekStart(d){
  const dt=new Date(d); const day=(dt.getDay()+6)%7; // Monday=0
  dt.setDate(dt.getDate()-day); return localISO(dt);
}
function computeMuscleVolume(){
  const D=SCHEMA.D, weekStart=isoWeekStart(new Date());
  const byGroup={};
  const groupOf=(exName)=>{
    const ex=EXLIB.find(e=>String(dv(e,SCHEMA.E.name)||"")===exName);
    return ex?String(dv(ex,SCHEMA.E.group)||"Other"):"Other";
  };
  const sessionDays={};
  LIFTS.forEach(l=>{
    const d=String(dv(l,SCHEMA.L.date)||"").slice(0,10);
    if(!d || d<weekStart) return;
    const g=groupOf(dv(l,SCHEMA.L.ex));
    const sets=n(dv(l,SCHEMA.L.sets))||1;
    byGroup[g]=(byGroup[g]||0)+sets;
    sessionDays[g]=sessionDays[g]||new Set(); sessionDays[g].add(d);
  });
  return Object.keys(byGroup).map(g=>({
    group:g, sets:byGroup[g], sessions:sessionDays[g]?sessionDays[g].size:0
  }));
}
/* This was by far the most expensive thing in the app: it ran on EVERY
   load and spent 2 API calls per muscle group (a lookup GET + a write),
   ~10 calls per open, uncached — enough on its own to blow the Free-plan
   1,000/month cap in about three weeks of normal use.
   Now: a signature of this week's computed volume is stored locally, and
   if nothing has changed since the last sync the whole function costs
   ZERO calls. Record ids are remembered per week too, so when volume DOES
   change it's a single PATCH per group instead of a GET+PATCH. */
const MV_CACHE_KEY=SKEY("mv_sync");
async function syncMuscleVolume(force){
  if(!SCHEMA.muscleVol||!SCHEMA.muscleVol.id) return;
  if(!navigator.onLine) return;   // queueing background housekeeping is pure noise
  const weekStart=isoWeekStart(new Date());
  const rows=computeMuscleVolume();
  if(!rows.length) return;
  const sig=weekStart+"|"+rows.map(r=>`${r.group}:${r.sets}:${r.sessions}`).join(",");
  let cache={};
  try{const v=await Store.get(MV_CACHE_KEY); if(v)cache=JSON.parse(v)}catch(e){}
  if(!force && cache.sig===sig) return;              // nothing moved — no API calls at all
  const ids=(cache.week===weekStart&&cache.ids)?cache.ids:{};
  for(const r of rows){
    try{
      const fields={[SCHEMA.MV.week]:weekStart,[SCHEMA.MV.group]:r.group,
        [SCHEMA.MV.sets]:r.sets,[SCHEMA.MV.sessions]:r.sessions};
      let id=ids[r.group];
      if(!id){
        // encodeURIComponent protects the URL, not the formula language — an
        // apostrophe in a Muscle Group name produced a malformed formula, a
        // 422, and a group that silently never synced.
        const qq=v=>String(v).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
        const existing=await at(`${BASE}/${SCHEMA.muscleVol.id}?filterByFormula=`+
          encodeURIComponent(`AND({Week}='${qq(weekStart)}',{Muscle Group}='${qq(r.group)}')`));
        if(existing.records&&existing.records.length) id=existing.records[0].id;
      }
      if(isLocalId(id)) continue;   // queued stub id — don't PATCH a nonexistent record
      if(id){
        await at(`${BASE}/${SCHEMA.muscleVol.id}/${id}`,{method:"PATCH",body:{fields,typecast:true}});
      }else{
        const made=await at(`${BASE}/${SCHEMA.muscleVol.id}`,
          {method:"POST",body:{records:[{fields}],typecast:true}});
        id=made&&made.records&&made.records[0]&&made.records[0].id;
      }
      if(id) ids[r.group]=id;
    }catch(e){ /* best-effort, one group failing shouldn't block the rest */ }
  }
  try{await Store.set(MV_CACHE_KEY,JSON.stringify({sig,week:weekStart,ids}))}catch(e){}
}


/* ---------- adherence: rolling rates, never streaks ---------- */
function adherence(days,fn){
  const today=new Date(localISO()+"T12:00:00");let hit=0;
  for(let i=0;i<days;i++){
    const k=localISO(new Date(today.getTime()-i*864e5));
    const rec=HISTORY.find(h=>String(dv(h,SCHEMA&&SCHEMA.D.date)||"").slice(0,10)===k);
    if(rec&&fn(rec))hit++;
  }
  return hit;
}
/* No streak functions exist by design. §4 HARD RULE: no streak counters
   anywhere. A missed day must nudge a percentage, never reset a counter —
   the reset is what turns one lapse into abandonment. Use adherence().  */

function daysSinceLastLog(){
  const dates=HISTORY.filter(h=>n(dv(h,SCHEMA&&SCHEMA.D.kcal))>0)
    .map(h=>String(dv(h,SCHEMA.D.date)||"").slice(0,10)).filter(Boolean).sort();
  if(!dates.length)return null;
  return daysBetween(dates[dates.length-1],localISO());
}
function nextAction(){
  const open=ACTIONS.filter(a=>{const s=String(dv(a,SCHEMA&&SCHEMA.A.status)||"").toLowerCase();
    return !(s.includes("done")||s.includes("complete"))});
  const rank=a=>{const p=String(dv(a,SCHEMA.A.priority)||"").toLowerCase();
    return p.includes("critical")?0:p.includes("high")?1:2};
  open.sort((a,b)=>rank(a)-rank(b)||String(dv(a,SCHEMA.A.opened)||"").localeCompare(String(dv(b,SCHEMA.A.opened)||"")));
  return open[0]||null;
}

/* ---------- AI MACRO READER (primary) + LEARNED CACHE ----------
   Order of attack, fastest first:
     1. LEARNED CACHE  — anything confirmed before is reused instantly, free.
     2. AI READER      — handles food that isn't in any library.
     3. LOCAL PARSER   — always works, so the app never dead-ends.
   The cache means the AI is called less and less over time.               */
const MODEL="claude-sonnet-4-6";
// api.anthropic.com only accepts requests from inside the Claude artifact
// sandbox — on any other host (Netlify, a plain browser tab, etc.) every
// call fails the same way every time. Once that happens once this session,
// stop retrying it and go straight to the browser-callable providers —
// there's no point re-paying that failed round trip on every single save.
let ANTHROPIC_DOWN=false;
const LEARN_KEY=SKEY("learned");
let LEARNED={};
let PARSE_SRC="";

async function loadLearned(){
  try{const v=await Store.get(LEARN_KEY);LEARNED=v?JSON.parse(v):{}}catch(e){LEARNED={}}
}
async function saveLearned(){
  try{await Store.set(LEARN_KEY,JSON.stringify(LEARNED))}catch(e){}
}
const learnKey=s=>String(s||"").toLowerCase().replace(/\s+/g," ").replace(/[^a-z0-9 ]/g,"").trim();

/* ---------- personal verified-food memory ----------
   LEARNED above only fires on an exact repeat of the raw text you typed.
   MY_VERIFIED is different: it's keyed by item NAME, and it's fed back
   into every AI prompt (Anthropic/Gemini/Groq/OpenRouter) as an extra
   "use these values exactly" line, same tier as the hardcoded label
   values — so once you correct a dish once, every future AI estimate of
   it (worded however) gets it right, not just an identical repeat. */
const VERIFIED_KEY=SKEY("verified");
let MY_VERIFIED={};
async function loadVerified(){
  try{const v=await Store.get(VERIFIED_KEY);MY_VERIFIED=v?JSON.parse(v):{}}catch(e){MY_VERIFIED={}}
}
async function saveVerifiedStore(){
  try{await Store.set(VERIFIED_KEY,JSON.stringify(MY_VERIFIED))}catch(e){}
}
function rememberItem(i){
  if(!pendingMeal)return;
  const it=pendingMeal.items[i];
  if(!it||!it.item)return;
  const key=learnKey(it.item);
  MY_VERIFIED[key]={item:it.item,qty:it.qty||"1 serving",kcal:n(it.kcal),protein:n(it.protein),
    carbs:n(it.carbs),fat:n(it.fat),fiber:n(it.fiber),sugar:n(it.sugar),sodium:n(it.sodium),calcium:n(it.calcium)};
  saveVerifiedStore();
  toast(`Remembered "${it.item}" — exact next time`);
  R();
}
/* ---------- passive food memory ----------
   MY_VERIFIED above only grows when he taps "Remember this", which in
   practice is rare. The bigger accuracy problem is drift: the same dal
   re-estimated three different ways across three weeks, so the weekly
   averages move for no real reason. AUTO_LEARNED records what was actually
   accepted on save — every item, every meal, no tap required — and feeds it
   back as a weaker "he has logged this before, stay consistent" tier. It
   never overrides a hand-verified entry or a hardcoded label value.
   Capped so the prompt cannot grow without bound. */
const AUTOLEARN_KEY=SKEY("autolearn");
const AUTOLEARN_MAX=60;
let AUTO_LEARNED={};
async function loadAutoLearned(){
  try{const v=await Store.get(AUTOLEARN_KEY);AUTO_LEARNED=v?JSON.parse(v):{}}catch(e){AUTO_LEARNED={}}
}
async function saveAutoLearned(){
  try{await Store.set(AUTOLEARN_KEY,JSON.stringify(AUTO_LEARNED))}catch(e){}
}
function autoLearnItems(items){
  if(!Array.isArray(items))return;
  let changed=false;
  items.forEach(it=>{
    if(!it||!it.item)return;
    const key=learnKey(it.item);
    if(!key||MY_VERIFIED[key])return;              // hand-verified always wins
    const prev=AUTO_LEARNED[key];
    const rec={item:it.item,qty:it.qty||"1 serving",kcal:n(it.kcal),protein:n(it.protein),
      carbs:n(it.carbs),fat:n(it.fat),fiber:n(it.fiber),sugar:n(it.sugar),
      sodium:n(it.sodium),calcium:n(it.calcium),
      hits:(prev&&prev.hits||0)+1,ts:Date.now()};
    AUTO_LEARNED[key]=rec;changed=true;
  });
  if(!changed)return;
  // Evict least-used-then-oldest so the store stays bounded.
  const keys=Object.keys(AUTO_LEARNED);
  if(keys.length>AUTOLEARN_MAX){
    keys.sort((a,b)=>(AUTO_LEARNED[a].hits-AUTO_LEARNED[b].hits)||(AUTO_LEARNED[a].ts-AUTO_LEARNED[b].ts));
    keys.slice(0,keys.length-AUTOLEARN_MAX).forEach(k=>delete AUTO_LEARNED[k]);
  }
  saveAutoLearned();
}
const fmtFoodLine=v=>`${v.item} ${v.qty}: ${v.kcal}kcal P${v.protein} C${v.carbs} F${v.fat}`+
  (v.fiber?` Fib${v.fiber}`:"")+(v.sugar?` Sugar${v.sugar}`:"")+
  (v.sodium?` Na${v.sodium}`:"")+(v.calcium?` Ca${v.calcium}`:"");

function verifiedPromptLines(){
  return Object.values(MY_VERIFIED).map(fmtFoodLine).join("\n");
}
/* Most-repeated first — those are the ones where consistency matters most. */
function autoLearnedPromptLines(limit=25){
  return Object.values(AUTO_LEARNED)
    .sort((a,b)=>(b.hits-a.hits)||(b.ts-a.ts))
    .slice(0,limit).map(fmtFoodLine).join("\n");
}

async function parseMealAI(raw){
  if(ANTHROPIC_DOWN)throw new Error("Anthropic unreachable this session");
  const prompt=`Convert this meal into macros.${DIET_HINT} Reply with ONLY a JSON array, no prose, no code fences. One object per distinct food item.

${verifiedPromptLines()?verifiedPromptLines()+"\n":""}${autoLearnedPromptLines()?`
Previously logged by this user — reuse for the same dish (scaled by quantity) so repeat meals stay
consistent. Outranked by the label values above, but preferred over your own fresh estimate:
${autoLearnedPromptLines()}
`:""}
Anything else: estimate standard home cooking, moderate oil, and set est=true.
Scale strictly and linearly with the stated quantity — never give two different quantities of the same
food identical macros.
Conventions: 1 katori = 150g, 1 roti = 40g raw, "half bowl" = 75g, bowl = 150g, cup = 200g, plate = 250g.
grain=1 for roti/rice/bread/oats/pasta/poha/idli/dosa/paratha/upma/noodles.
legume=1 for dal/rajma/chana/chole/sattu/sambar.
tol: "Safe" | "Caution" | "Trigger". Trigger = maltitol/sorbitol, deep fried, cream gravies. Caution = legumes, wheat fructans, whey.

Meal: "${raw}"

JSON array shape exactly:
[{"item":"short name","qty":"100g","kcal":0,"protein":0,"carbs":0,"fat":0,"fiber":0,"sugar":0,"sodium":0,"calcium":0,"grain":0,"legume":0,"tol":"Safe","est":true,"note":"assumption in one short clause"}]`;
  const call=(async()=>{
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:MODEL,max_tokens:1400,messages:[{role:"user",content:prompt}]})});
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n");
    const a=text.indexOf("["),b=text.lastIndexOf("]");
    if(a<0||b<0)throw new Error("unreadable reply");
    const arr=JSON.parse(text.slice(a,b+1));
    return Array.isArray(arr)?arr:[arr];
  })();
  let t;const bail=new Promise((_,rj)=>{t=setTimeout(()=>rj(new Error("timed out")),22000)});
  try{return await Promise.race([call,bail])}
  catch(e){ANTHROPIC_DOWN=true;throw e}
  finally{clearTimeout(t)}
}

async function groqJSON(prompt){
  if(!GROQKEY)throw new Error("no key");
  const models=GROQ_MODEL_OK?[GROQ_MODEL_OK]:GROQ_MODELS;
  let lastErr=null;
  for(const m of models){
    try{
      const res=await fetch("https://api.groq.com/openai/v1/chat/completions",{
        method:"POST",
        headers:{"Content-Type":"application/json","Authorization":"Bearer "+GROQKEY},
        body:JSON.stringify({model:m,temperature:0.2,
          messages:[{role:"user",content:prompt+"\n\nRespond with ONLY the JSON array, no prose, no markdown fences."}]})});
      if(!res.ok){
        const t=await res.text();
        if(res.status===401)throw new Error("key rejected");
        lastErr=new Error(m+": HTTP "+res.status);continue;
      }
      const data=await res.json();
      const txt=(((data.choices||[])[0]||{}).message||{}).content||"";
      const a=txt.indexOf("["),b=txt.lastIndexOf("]");
      const arr=JSON.parse(a>=0&&b>0?txt.slice(a,b+1):txt);
      GROQ_MODEL_OK=m;
      return Array.isArray(arr)?arr:(arr.items||[arr]);
    }catch(e){
      if(/key rejected/.test(e.message))throw e;
      lastErr=e;
    }
  }
  throw lastErr||new Error("no model responded");
}
async function groqChat(system,messages){
  if(!GROQKEY)throw new Error("no key");
  const models=GROQ_MODEL_OK?[GROQ_MODEL_OK]:GROQ_MODELS;
  const msgs=[{role:"system",content:system},...messages.map(m=>({role:m.role,content:m.content}))];
  const errs=[];
  for(const m of models){
    try{
      const res=await fetch("https://api.groq.com/openai/v1/chat/completions",{
        method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+GROQKEY},
        body:JSON.stringify({model:m,temperature:0.4,messages:msgs})});
      if(!res.ok){
        const t=await res.text();
        if(res.status===401)throw new Error("key rejected");
        errs.push(m+": HTTP "+res.status+(t?" — "+t.slice(0,120):""));continue;
      }
      const data=await res.json();
      const txt=(((data.choices||[])[0]||{}).message||{}).content||"";
      if(!txt){errs.push(m+": empty reply");continue}
      GROQ_MODEL_OK=m;
      return txt.trim();
    }catch(e){
      if(/key rejected/.test(e.message))throw e;
      errs.push(m+": "+((e&&e.message)||String(e)));
    }
  }
  throw new Error(errs.join(" / ")||"no model responded");
}

  {id:"groq",label:"Groq",hasKey:()=>!!GROQKEY,json:raw=>parseMealGroq(raw),chat:(s,m)=>groqChat(s,m)},

async function geminiJSON(prompt){
  if(!GEMKEY)throw new Error("no key");
  const models=GEM_MODEL_OK?[GEM_MODEL_OK]:GEM_MODELS;
  let lastErr=null;
  for(const m of models){
    try{
      const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{
        method:"POST",
        headers:{"Content-Type":"application/json","x-goog-api-key":GEMKEY},
        body:JSON.stringify({contents:[{parts:[{text:prompt}]}],
          generationConfig:{temperature:0.2,responseMimeType:"application/json"}})});
      if(!res.ok){
        const t=await res.text();
        if(res.status===400&&/API key/i.test(t))throw new Error("key rejected");
        lastErr=new Error(m+": HTTP "+res.status);continue;
      }
      const data=await res.json();
      const txt=(((data.candidates||[])[0]||{}).content||{}).parts?.[0]?.text||"";
      const a=txt.indexOf("["),b=txt.lastIndexOf("]");
      const arr=JSON.parse(a>=0&&b>0?txt.slice(a,b+1):txt);
      GEM_MODEL_OK=m;
      return Array.isArray(arr)?arr:(arr.items||[arr]);
    }catch(e){
      if(/key rejected/.test(e.message))throw e;
      lastErr=e;
    }
  }
  throw lastErr||new Error("no model responded");
}

/* ---------- COACH — live consultancy layer ----------
   Same dual-provider pattern as the macro reader (Anthropic first, inside
   the artifact runtime; Gemini fallback everywhere else), but returning
   prose instead of JSON, and carrying a system prompt instead of a single
   one-shot instruction.
   Two callers use this:
     - coachAsk()  — the open "Ask Coach" chat, keeps rolling history.
     - coachNote() — a one-shot, unlogged, 1-3 sentence inline tip fired
       automatically after a save (food/gym), never part of the chat.     */
async function coachCallAnthropic(system,messages){
  if(ANTHROPIC_DOWN)throw new Error("Anthropic unreachable this session");
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:MODEL,max_tokens:700,system,messages})});
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    const txt=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
    if(!txt)throw new Error("empty reply");
    return txt;
  }catch(e){ANTHROPIC_DOWN=true;throw e}
}
async function coachCallGemini(system,messages){
  if(!GEMKEY)throw new Error("no key");
  const models=GEM_MODEL_OK?[GEM_MODEL_OK]:GEM_MODELS;
  const contents=messages.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]}));
  const errs=[];
  for(const m of models){
    try{
      const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{
        method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":GEMKEY},
        body:JSON.stringify({system_instruction:{parts:[{text:system}]},contents,
          generationConfig:{temperature:0.4}})});
      if(!res.ok){
        const t=await res.text();
        if(res.status===400&&/API key/i.test(t))throw new Error("key rejected");
        errs.push(m+": HTTP "+res.status+(t?" — "+t.slice(0,150):""));continue;
      }
      const data=await res.json();
      const txt=(((data.candidates||[])[0]||{}).content||{}).parts?.map(p=>p.text).join("")||"";
      if(!txt){errs.push(m+": empty reply");continue}
      GEM_MODEL_OK=m;
      return txt.trim();
    }catch(e){
      if(/key rejected/.test(e.message))throw e;
      errs.push(m+": "+((e&&e.message)||String(e)));
    }
  }
  throw new Error(errs.join(" / ")||"no model responded");
}
async function coachReply(system,messages){
  const call=(async()=>{
    try{ return await coachCallAnthropic(system,messages); }catch(e){}
    const connected=orderedProviders();
    if(!connected.length)throw new Error("No AI connected — add a Gemini, Groq, or OpenRouter key in Stats to use the coach outside the artifact runtime.");
    const fails=[];
    for(const p of connected){
      try{ return await p.chat(system,messages); }catch(e){ fails.push(p.label+": "+((e&&e.message)||String(e))); }
    }
    throw new Error("All connected AI providers failed — "+fails.join(" | "));
  })();
  let t;const bail=new Promise((_,rj)=>{t=setTimeout(()=>rj(new Error("timed out")),22000)});
  try{return await Promise.race([call,bail])}finally{clearTimeout(t)}
}

/* The rules a coach reply must never violate — condensed from the OS
   Reference and Sonnet Instructions Addendum. This has to be re-declared
   here rather than read from the Claude Project, because the app runs as
   a standalone page with no access to it. Update this block by hand if
   the source-of-truth docs change. */
function coachPrefsBlock(){
  const s=SETUP||{}; const bits=[];
  if(s.displayName)bits.push("The user's name is "+s.displayName+".");
  if(s.goal&&GOALS&&GOALS[s.goal])bits.push("Primary goal: "+GOALS[s.goal][0]+".");
  if(s.activity&&ACTIVITY&&ACTIVITY[s.activity])bits.push("Activity level: "+ACTIVITY[s.activity][0]+".");
  if(s.trainingDays)bits.push("Trains about "+s.trainingDays+" days a week.");
  if(s.equipment)bits.push("Equipment available: "+s.equipment+".");
  if(s.avoidFoods)bits.push("MUST NOT suggest these foods: "+s.avoidFoods+".");
  if(s.targetWeightKg)bits.push("Target weight: "+s.targetWeightKg+"kg.");
  if(s.tone==="direct")bits.push("Tone: direct and factual. No cheerleading.");
  if(s.tone==="supportive")bits.push("Tone: warm and encouraging, gentle framing.");
  if(s.tone==="strict")bits.push("Tone: hold them to the target and name the gap plainly.");
  return bits.length?"\n\nUSER PREFERENCES:\n"+bits.join("\n"):"";
}
const COACH_SYSTEM_BASE=(window.ABOS_CONFIG&&window.ABOS_CONFIG.coachSystem)||`You are a personal health coach embedded in a tracking app. Not a generic motivational AI.

You are given the user's real data below — today's numbers, this week's trend, open actions,
supplement stock, recent labs, recent lift history. Use it directly. Never ask the user to repeat
information that is already in front of you.

HARD RULES:
- Never diagnose. Flag patterns worth discussing and route them to a GP or specialist.
- Never invent a number. If a value is missing from the data, say it is missing.
- Respect any user-specific rules supplied in config (allergies, injuries, intolerances,
  contraindicated supplements). Those override anything you would otherwise recommend.

PROGRAMMING A SESSION — behave like a coach reading a training log, not a search engine:

  Never write "your usual weight" or a rep range with no load. If an exercise has no history,
  say so and give a conservative starting load, flagged as an estimate.

  load — 2.5kg isolation, 5kg compounds — and drop back to the bottom of the range.
- If the last two entries for a lift are flat or falling, do not add weight. Say it stalled and

protein and sleep only — pause dieting and hard training entirely).

TONE: direct, calm, practical. Never shame, guilt-trip, catastrophise or fake positivity. A bad
workout still counts as showing up. Identify the 1-3 highest-leverage actions, never a long list —

say briefly why the user is on track rather than manufacturing advice.`;
Object.defineProperty(globalThis,"COACH_SYSTEM",{get:()=>COACH_SYSTEM_BASE+coachPrefsBlock()});

/* ---------- LIFT HISTORY PACK ----------
   The coach used to be told only "Gym today: not started", so when asked to
   program a session it had no choice but to invent loads or ask. LIFTS is
   already in memory (last 100 rows, newest first — roughly four weeks) and
   Lift Log stores one row per exercise per day (weight = best set, sets =
   count, reps = average), so this costs no extra Airtable call. It just
   reshapes what's already loaded into per-exercise progression lines the
   model can actually program the next session from. */
function liftHistoryPack(limitEx=16,perEx=3){
  if(!SCHEMA||!LIFTS.length)return "";
  const L=SCHEMA.L, byEx=new Map();
  LIFTS.forEach(l=>{
    const nm=String(dv(l,L.ex)||"").trim();
    if(!nm)return;
    const w=n(dv(l,L.w)), s=n(dv(l,L.sets)), r=n(dv(l,L.reps));
    if(!r&&!w)return;
    if(!byEx.has(nm))byEx.set(nm,[]);
    const arr=byEx.get(nm);
    if(arr.length<perEx)arr.push({d:String(dv(l,L.date)||""),w,s,r});
  });
  const out=[];
  for(const [nm,arr] of byEx){
    if(out.length>=limitEx)break;
    // Newest first. A rising top-set across entries is the progression signal.
    const hist=arr.map(x=>`${x.d} ${x.w?x.w+"kg":"bodyweight"}×${x.s||1}×${x.r||"?"}`).join(" ← ");
    let trend="";
    if(arr.length>1&&arr[0].w&&arr[1].w){
      const d=r1(arr[0].w-arr[1].w);
      trend=d>0?`  [+${d}kg vs previous]`:d<0?`  [${d}kg vs previous]`:"  [flat]";
    }
    out.push(`${nm}: ${hist}${trend}`);
  }
  return out.join("\n");
}

/* Days since each muscle group was last trained — the other half of what a
   trainer needs before programming. Group comes from the Exercise Library
   where available, so it follows however the library is categorised rather
   than a hardcoded mapping here. */
function groupRecency(){
  if(!SCHEMA||!LIFTS.length)return "";
  const today=new Date(localISO()+"T12:00:00");
  const grpOf={};
  EXLIB.forEach(e=>{
    const nm=String(dv(e,SCHEMA.E.name)||"").trim().toLowerCase();
    const g=String(dv(e,SCHEMA.E.group)||"").trim();
    if(nm&&g)grpOf[nm]=g;
  });
  const seen={};
  LIFTS.forEach(l=>{
    const nm=String(dv(l,SCHEMA.L.ex)||"").trim().toLowerCase();
    const g=grpOf[nm];
    if(!g)return;
    const d=String(dv(l,SCHEMA.L.date)||"");
    if(!d)return;
    if(!seen[g]||d>seen[g])seen[g]=d;
  });
  const parts=Object.keys(seen).sort().map(g=>{
    const days=Math.round((today-new Date(seen[g]+"T12:00:00"))/86400000);
    return `${g} ${days===0?"today":days===1?"1d ago":days+"d ago"}`;
  });
  return parts.join(" · ");
}

const NUMWORDS={half:0.5,"1/2":0.5,quarter:0.25,one:1,a:1,an:1,two:2,couple:2,three:3,four:4,five:5,six:6};
const UNITG={katori:150,bowl:150,cup:200,plate:250,glass:200,scoop:1,bottle:1,packet:1,piece:1,slice:1,tsp:5,tbsp:15};

function parseQty(text,food){
  const t=" "+text.toLowerCase()+" ";
  let grams=null,count=null,label="";
  // explicit weight/volume
  let m=t.match(/(\d+(?:\.\d+)?)\s*(g|gm|gms|gram|grams|ml)\b/);
  if(m){grams=parseFloat(m[1]);label=grams+(m[2].startsWith("m")?"ml":"g")}
  if(grams===null){
    // number or number-word, optionally followed by a container unit
    let num=null;
    const nm=t.match(/(?:^|\s)(\d+(?:\.\d+)?)\s/);
    if(nm)num=parseFloat(nm[1]);
    else{for(const w in NUMWORDS){if(t.includes(" "+w+" ")){num=NUMWORDS[w];break}}}
    const um=t.match(/\b(katori|bowl|cup|plate|glass|scoop|bottle|packet|piece|slice|tsp|tbsp)s?\b/);
    if(um){const u=um[1];const per=UNITG[u];
      if(food.per==="100g"){grams=(num||1)*per;label=(num||1)+" "+u}
      else{count=(num||1);label=(num||1)+" "+u}}
    else if(num!=null){
      if(food.per==="unit"){count=num;label=num+" "+(food.unit||"")}
      else{grams=num*(food.unitG||100);label=num+" × standard"}
    }
  }
  if(grams===null&&count===null){
    if(food.per==="unit"){count=1;label="1 "+(food.unit||"serving")}
    else{grams=food.unitG||100;label=(food.unitG||100)+"g"}
  }
  /* An explicit weight/volume was being thrown away for "per unit" foods:
     "300ml milk" and "200ml milk" both scored as one 200ml serving, and
     "100g whey" as a single 30g scoop — while the label still read 300ml,
     which hid the error on the confirm screen. Convert via the unit weight
     when we know it. */
  let mult;
  if(food.per==="100g") mult=grams/100;
  else if(count!=null) mult=count;
  else if(grams!=null && food.unitG) mult=grams/food.unitG;
  return {mult:(isFinite(mult)&&mult>0)?mult:1,label:label.trim()};
}

  m:[185,3,7,16,1,4,460,90],tol:"Trigger",why:"known trigger"},

const PREP_WORDS=[].concat(...GRAVIES.map(g=>g.k));
function isPrepared(chunk){const t=" "+chunk.toLowerCase()+" ";return PREP_WORDS.some(k=>t.includes(k))}
function estimateDish(chunk){
  const t=" "+chunk.toLowerCase()+" ";
  const found=[];
  BASES.forEach(b=>{if(b.k.some(k=>t.includes(k)))found.push(b)});
  if(!found.length)return null;
  let g=null;
  for(const gr of GRAVIES){if(gr.k.some(k=>t.includes(k))){g=gr;break}}
  if(!g)g=GRAVIES[1]; // an unqualified Indian dish is usually a masala gravy
  // split the base contribution if several vegetables are named
  const share=1/found.length;
  const m=[0,0,0,0,0,0,0,0];
  found.forEach(b=>{for(let i=0;i<8;i++)m[i]+=b.m[i]*share});
  for(let i=0;i<8;i++)m[i]+=g.m[i];
  const name=found.map(b=>b.n).join(" + ")+" · "+g.n;
  return {n:name,per:"100g",unitG:150,multi:found.length>1,m:m.map(v=>Math.round(v/1.5*10)/10),
    tol:g.tol||"Caution",est:1,note:"estimated as "+name+(g.why?" — "+g.why:"")};
}

function matchFood(chunk){
  const t=chunk.toLowerCase();
  let best=null,bestScore=0;
  // Your own remembered corrections outrank everything, including the
  // hardcoded label-verified list — they're the most recently confirmed
  // truth for exactly this dish.
  Object.values(MY_VERIFIED).forEach(v=>{
    const kw=learnKey(v.item);
    if(kw&&t.includes(kw)){
      const score=kw.length+3;
      if(score>bestScore){bestScore=score;best={k:[kw],n:v.item,per:"unit",
        m:[v.kcal,v.protein,v.carbs,v.fat,v.fiber||0,v.sugar||0,v.sodium||0,v.calcium||0],v:1,tol:"Safe"}}
    }
  });
  FOODDB.forEach(f=>{
    f.k.forEach(kw=>{
      if(t.includes(kw)){
        const score=kw.length+(f.v?2:0); // prefer longer, more specific, verified matches
        if(score>bestScore){bestScore=score;best=f}
      }
    });
  });
  return best;
}

/* Returns the same shape the confirmation card expects. Never throws. */
function parseMeal(raw){
  const parts=raw.split(/,|\band\b|\+|\n|;/).map(s=>s.trim()).filter(Boolean);
  const out=[];
  parts.forEach(p=>{
    // A branded/label-verified item always wins. Otherwise, if the text names a
    // preparation ("butter masala", "malai", "fry") or more than one vegetable,
    // it's a cooked dish — estimate it rather than returning the raw ingredient.
    let f=matchFood(p);
    if(!f||!f.v){
      const dish=estimateDish(p);
      if(dish&&(isPrepared(p)||dish.multi))f=dish;
      else if(!f)f=dish;
    }
    if(!f){
      out.push({item:p.slice(0,60),qty:"check this",kcal:0,protein:0,carbs:0,fat:0,fiber:0,sugar:0,
        sodium:0,calcium:0,grain:0,legume:0,tol:"Safe",est:true,note:"not recognised — enter macros yourself"});
      return;
    }
    const {mult,label}=parseQty(p,f);
    const s=(i)=>Math.round(f.m[i]*mult*10)/10;
    out.push({item:f.est?p.trim().slice(0,60):f.n,qty:label,kcal:Math.round(f.m[0]*mult),protein:s(1),carbs:s(2),fat:s(3),
      fiber:s(4),sugar:s(5),sodium:Math.round(f.m[6]*mult),calcium:Math.round(f.m[7]*mult),
      grain:f.grain?1:0,legume:f.legume?1:0,tol:f.tol||"Safe",est:!f.v,note:f.note||""});
  });
  return out.length?out:[{item:raw.slice(0,60),qty:"",kcal:0,protein:0,carbs:0,fat:0,fiber:0,sugar:0,
    sodium:0,calcium:0,grain:0,legume:0,tol:"Safe",est:true,note:"enter macros yourself"}];
}

/* ---------- confirm-then-write ---------- */
async function readMeal(){
  const raw=(document.getElementById("nl")||{}).value||"";
  if(!raw.trim()){toast("Describe the meal first",true);return}
  window._nl=raw;
  const key=learnKey(raw);
  const norm=arr=>arr.map(x=>({item:x.item||"item",qty:x.qty||"",kcal:n(x.kcal),protein:n(x.protein),
    carbs:n(x.carbs),fat:n(x.fat),fiber:n(x.fiber),sugar:n(x.sugar),sodium:n(x.sodium),
    calcium:n(x.calcium),grain:x.grain?1:0,legume:x.legume?1:0,tol:x.tol||"Safe",
    est:!!x.est,note:x.note||""}));

  // 1. seen this exact meal before → instant, no call
  if(LEARNED[key]){
    PARSE_SRC="remembered";
    pendingMeal={raw:raw.trim(),meal:window._meal||defaultMeal(),items:norm(LEARNED[key])};
    lastError=null;SYNC="idle";R();return;
  }

  SYNC="working";lastError=null;R();
  const show=(items,src)=>{PARSE_SRC=src;
    pendingMeal={raw:raw.trim(),meal:window._meal||defaultMeal(),items:norm(items)};
    SYNC="idle";R()};

  // 2. Anthropic (free, but only reachable inside the artifact runtime)
  try{ return show(await parseMealAI(raw.trim()),"AI"); }catch(e){}

  // 3. Every connected browser-callable provider, in preference order —
  // Gemini/Groq/OpenRouter today, whatever gets added to AI_PROVIDERS later.
  const providers=orderedProviders();
  for(const p of providers){
    try{ return show(await p.json(raw.trim()),"AI"); }
    catch(e){ if(/key rejected/.test(e.message)){toast(p.label+" key rejected",true);} }
  }

  // 4. offline estimator — always works, never a dead end
  show(parseMeal(raw.trim()), providers.length?"offline reader":"offline reader · add an AI key in Stats");
}

    });

    (made.records||[]).forEach(r=>FOODS.push(flat(r)));

    // first, AI only called when there's actually something to say.

      const bits=[];
      if(flagged.length)bits.push("flagged items: "+flagged.map(it=>`${it.item} (${it.tol})`).join(", "));
      if(grainsOver)bits.push("grains today over the 1/day rule");
      if(proteinBehind)bits.push("protein still behind target with dinner already logged");
      coachNote(`He just logged ${mealName} — ${mealItems}. Relevant: ${bits.join("; ")}. Give one short, specific, non-alarmist note.`)
        .then(txt=>{if(txt){COACH_TIP={text:txt,source:"after logging food"};R()}});
    }
  }catch(e){SYNC="error";lastError=(e&&e.message)||String(e);toast("Save failed",true)}
  R();
}

/* ---------- voice ----------
   One mic implementation, reusable by any textarea via its element id.
   Food already used this; build order item 7 hooks the same function up
   to Gym and the Body check-in instead of building a second version. */
function toggleMic(targetId){
  const id=targetId||"nl";
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast("Voice isn't supported in this browser",true);return}
  if(recording&&recog){recog.stop();return}
  recog=new SR();recog.lang="en-IN";recog.interimResults=true;recog.continuous=false;
  let finalText=(document.getElementById(id)||{}).value||"";
  recog.onstart=()=>{recording=true;micTarget=id;R()};
  recog.onresult=e=>{let interim="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal)finalText+=(finalText?" ":"")+t;else interim+=t}
    const el=document.getElementById(id);if(el)el.value=(finalText+" "+interim).trim();
    if(id==="nl")window._nl=el?el.value:finalText;
    else{window._voice=window._voice||{};window._voice[id]=el?el.value:finalText}};
  recog.onerror=ev=>{recording=false;toast("Mic: "+(ev.error||"error"),true);R()};
  recog.onend=()=>{recording=false;R()};
  try{recog.start()}catch(e){toast("Couldn't start mic",true)}
}

     meant pull-ups, dips, push-ups and any bodyweight work were discarded
     on save with a "log at least one set" error — the session was lost. */
  const done=g.ex.filter(e=>e.sets.some(s=>n(s.r)>0));
  const cardioOnly=g.split==="Cardio only";
  const isRest=g.split==="Rest";
  // A rest day is a valid, loggable thing — it should never demand sets.
  // Protecting rest is part of the protocol, not an absence of data.
  // Cardio-only must still require actual minutes — it used to skip this
  // check entirely, which is how near-empty duplicate rows got created.
  if(!isRest&&!done.length&&!n(g.cardio)){toast(cardioOnly?"Log the cardio minutes":"Log at least one set, or cardio minutes",true);return}
  SYNC="working";R();
  try{
    // Update today's session record instead of always inserting a new one —
    // this is what was causing duplicate Gym Sessions rows when Save was
    // tapped more than once in a day.
    const existingSession=todayGymSession();
    if(SCHEMA.gym.id){
      const f={};
      if(SCHEMA.G.date)f[SCHEMA.G.date]=localISO();
      if(SCHEMA.G.split)f[SCHEMA.G.split]=g.split;
      if(SCHEMA.G.dur&&n(g.dur))f[SCHEMA.G.dur]=n(g.dur);
      if(SCHEMA.G.cardio&&n(g.cardio))f[SCHEMA.G.cardio]=n(g.cardio);
      if(SCHEMA.G.core)f[SCHEMA.G.core]=!!g.core||!!(existingSession&&dv(existingSession,SCHEMA.G.core));
      if(existingSession){
        await at(`${BASE}/${SCHEMA.gym.id}/${existingSession.id}`,{method:"PATCH",body:{fields:f,typecast:true}});
      }else{
        await at(`${BASE}/${SCHEMA.gym.id}`,{method:"POST",body:{records:[{fields:f}],typecast:true}});
      }
    }
    // Same idea for Lift Log: replace today's rows for exercises being
    // re-saved rather than piling up extra sets on top of the old ones.
    const todayISO=localISO();
    const doneNames=done.map(e=>e.n.toLowerCase());
    const staleLiftIds=LIFTS.filter(l=>String(dv(l,SCHEMA.L.date))===todayISO
      &&doneNames.includes(String(dv(l,SCHEMA.L.ex)||"").toLowerCase())).map(l=>l.id);
    if(staleLiftIds.length&&SCHEMA.lift.id){
      for(let i=0;i<staleLiftIds.length;i+=10){
        const qs=staleLiftIds.slice(i,i+10).map(id=>`records[]=${id}`).join("&");
        await at(`${BASE}/${SCHEMA.lift.id}?${qs}`,{method:"DELETE"});
      }
    }
    const liftRecs=[];
    done.forEach(e=>{
      const valid=e.sets.filter(s=>n(s.r)>0);
      const best=Math.max(...valid.map(s=>n(s.w)));
      const f={};
      if(SCHEMA.L.date)f[SCHEMA.L.date]=localISO();
      if(SCHEMA.L.ex)f[SCHEMA.L.ex]=e.n;
      if(SCHEMA.L.w)f[SCHEMA.L.w]=best;
      if(SCHEMA.L.sets)f[SCHEMA.L.sets]=valid.length;
      if(SCHEMA.L.reps)f[SCHEMA.L.reps]=Math.round(valid.reduce((s,x)=>s+n(x.r),0)/valid.length);
      liftRecs.push({fields:f});
      if(e.last&&best>n(e.last))setTimeout(()=>toast("PR — "+e.n+" "+best+"kg  +150 XP"),400);
    });
    if(liftRecs.length&&SCHEMA.lift.id){
      for(let i=0;i<liftRecs.length;i+=10)
        await at(`${BASE}/${SCHEMA.lift.id}`,{method:"POST",body:{records:liftRecs.slice(i,i+10),typecast:true}});
    }
    // Refresh the in-memory copies so the "logged today" summary and the
    // duplicate guard above are correct the next time this runs.
    try{
      const gsr=await q(SCHEMA.gym.id,`pageSize=30&sort%5B0%5D%5Bfield%5D=${SCHEMA.G.date}&sort%5B0%5D%5Bdirection%5D=desc`);
      GSESS=(gsr.records||[]).map(flat);
      setCache("gsess",gsr.records||[]);
    }catch(e){}
    try{
      const lr=await q(SCHEMA.lift.id,`pageSize=100&sort%5B0%5D%5Bfield%5D=${SCHEMA.L.date}&sort%5B0%5D%5Bdirection%5D=desc`);
      LIFTS=(lr.records||[]).map(flat);
      setCache("lifts",lr.records||[]);
    }catch(e){}
    // Rest days are recorded but must not set "Gym Done" — that flag drives
    // the training-day carb target and the gym XP award.
    await patchDaily(SCHEMA.D.gymDone&&!isRest?{[SCHEMA.D.gymDone]:true}:{},isRest?"Rest day logged":"Session saved");
    // Proactive tip — only when a logged best actually came in below the
    // last recorded weight for that exercise. PRs already get their own
    // toast above; this is for the opposite case, where AI judgment (is
    // this fatigue, recovery debt, or worth a deload?) actually helps.
    const regressions=done.filter(e=>{
      const valid=e.sets.filter(s=>n(s.r)>0);
      const best=valid.length?Math.max(...valid.map(s=>n(s.w))):0;
      return e.last&&best<n(e.last);
    });
    if(regressions.length){
      const summary=regressions.map(e=>`${e.n} best this session vs last ${e.last}kg logged`).join("; ");
      coachNote(`He just logged today's session (${g.split}). These came in below last time: ${summary}. One short, specific note — fatigue/recovery context vs something worth watching, and whether to hold or ease back next time.`)
        .then(txt=>{if(txt){COACH_TIP={text:txt,source:"after gym"};R()}});
    }
    initGym();
  }catch(e){SYNC="error";lastError=(e&&e.message)||String(e);toast("Save failed",true);R()}
}

/* ---------- gym voice (build order item 7) ----------
   Deterministic, offline — sets and reps are stated directly in speech,
   so there's no macro-estimation problem here the way there is for food.
   Parses into GYMTODAY, which stays on-screen and editable and only
   reaches Airtable when Save session is tapped — same confirm-before-
   write rule as everything else in the app.                             */
function knownExerciseNames(){
  const set=new Set();
  Object.values(SPLIT_EX).forEach(arr=>arr.forEach(nm=>set.add(nm)));
  EXLIB.forEach(e=>{const nm=dv(e,SCHEMA.E.name);if(nm)set.add(String(nm))});
  (GYMTODAY&&GYMTODAY.ex||[]).forEach(e=>set.add(e.n));
  return [...set];
}
function matchExercise(chunk){
  const t=chunk.toLowerCase();
  let best=null,bestLen=0;
  knownExerciseNames().forEach(nm=>{
    const k=nm.toLowerCase();
    if(t.includes(k)&&k.length>bestLen){best=nm;bestLen=k.length}
  });
  if(best)return best;
  const words=chunk.trim().replace(/\d+(\.\d+)?\s*kg|\d+\s*x\s*\d+|\d+/g,"").trim().split(/\s+/).filter(Boolean);
  if(!words.length)return null;
  return words.slice(0,3).join(" ").replace(/\b\w/g,c=>c.toUpperCase());
}
/* Capped at 12. A stray number in a voice transcript ("leg press 100 x 10")
   used to generate 100 empty set rows, which then failed the save filter
   entirely — the whole session was silently lost. */
function mkSets(count,reps,w){
  const c=Math.min(Math.max(Math.round(Number(count)||0),1),12);
  return Array.from({length:c},()=>({w,r:reps}));
}
function parseSetsReps(chunk){
  const t=chunk.toLowerCase();
  const wMatch=t.match(/(\d+(?:\.\d+)?)\s*kg/);
  const w=wMatch?parseFloat(wMatch[1]):"";
  // "A x B" is ambiguous: "3 x 10" means 3 sets of 10, but "100 x 10" is
  // gym shorthand for 100kg for 10 reps. Reading the latter as 100 sets
  // produced a wall of empty rows that then failed to save at all.
  let m=t.match(/(\d+)\s*sets?\s*x\s*(\d+)/);
  if(m)return mkSets(parseInt(m[1]),parseInt(m[2]),w);
  m=t.match(/(\d+(?:\.\d+)?)\s*x\s*(\d+)/);
  if(m){
    const a=parseFloat(m[1]), reps=parseInt(m[2]);
    if(a>12 && w==="") return [{w:a,r:reps}];    // weight × reps
    return mkSets(a,reps,w);                     // sets × reps
  }
  m=t.match(/(\d+)\s*sets?\s*of\s*(\d+)/);
  if(m)return mkSets(parseInt(m[1]),parseInt(m[2]),w);
  m=t.match(/(\d+(?:\s*,\s*\d+){1,})/);
  if(m)return m[1].split(",").map(s=>({w,r:parseInt(s.trim())}));
  m=t.match(/(\d+)\s*reps?/);
  if(m)return [{w,r:parseInt(m[1])}];
  return w!==""?[{w,r:""}]:[];
}
function parseGymVoice(raw){
  const out={cardio:null,core:false,ex:[]};
  const cardioM=raw.match(/(\d+)\s*min\w*\s*(?:of\s*)?cardio|cardio\D{0,12}?(\d+)\s*min|(?:ran|walked|jogged|cycled|elliptical)\D{0,12}?(\d+)\s*min/i);
  if(cardioM)out.cardio=parseInt(cardioM[1]||cardioM[2]||cardioM[3]);
  if(/\bcore\b|\bplank\b|\bcrunch/i.test(raw))out.core=true;
  const names=knownExerciseNames();
  raw.split(/\band\b|;|\n/i).map(s=>s.trim()).filter(Boolean).forEach(chunk=>{
    if(/^\d+\s*min|cardio|core|plank|crunch/i.test(chunk)&&!names.some(nm=>chunk.toLowerCase().includes(nm.toLowerCase())))return;
    const name=matchExercise(chunk);
    const sets=parseSetsReps(chunk);
    if(name&&sets.length)out.ex.push({name,sets});
  });
  return out;
}
function applyGymVoice(){
  const el=document.getElementById("gymvoice");
  const raw=(el&&el.value||"").trim();
  if(!raw){toast("Say or type the session first",true);return}
  if(!GYMTODAY)initGym();
  const parsed=parseGymVoice(raw);
  if(parsed.cardio!=null)GYMTODAY.cardio=String(parsed.cardio);
  if(parsed.core)GYMTODAY.core=true;
  let added=0;
  parsed.ex.forEach(p=>{
    let e=GYMTODAY.ex.find(x=>x.n.toLowerCase()===p.name.toLowerCase());
    if(!e){e={n:p.name,last:lastWeight(p.name),sets:[]};GYMTODAY.ex.push(e)}
    p.sets.forEach(s=>{e.sets.push({w:s.w,r:s.r});added++});
  });
  window._voice=Object.assign(window._voice||{},{gymvoice:""});
  if(el)el.value="";
  if(!added&&parsed.cardio==null&&!parsed.core){toast('Couldn\'t make out any sets — try "exercise, weight kg, sets x reps"',true);return}
  toast(added?`Filled ${added} set${added===1?"":"s"} — check before saving`:"Applied ✓");
  R();
}

/* ---------- checklist ----------
   Two different field types, handled differently:
   - Skincare AM/PM and Supplements AM/PM are Airtable multipleSelects —
     each holds a LIST of items, so ticking one item adds/removes it from
     that list rather than flipping a single true/false.
   - Nasal device, Left-side sleep, and the evening-cutoff flag are plain
     checkboxes — one tap, one field.                                    */
// Yes/no habits shown on Today. Each `f` must map to a boolean field in
// SCHEMA.D. Supplied via config so the public build ships no personal routine.
const CHECK_BOOL=(window.ABOS_CONFIG&&window.ABOS_CONFIG.boolChecks)||[];
const CHECK_MULTI=[
 {f:"suppAM",label:"Supplements AM"},
 {f:"skinAM",label:"Skincare AM"},
 {f:"suppPM",label:"Supplements PM"},
 {f:"skinPM",label:"Skincare PM"}
];
function toggleCheck(key){
  const f=SCHEMA.D[key];if(!f){toast("That field isn't in the base",true);return}
  patchDaily({[f]:!DAILY[f]},"Checklist");
}
function toggleMulti(groupKey,item){
  const f=SCHEMA.D[groupKey];if(!f){toast("That field isn't in the base",true);return}
  const cur=Array.isArray(DAILY[f])?DAILY[f].slice():[];
  const i=cur.indexOf(item);
  if(i>=0)cur.splice(i,1);else cur.push(item);
  patchDaily({[f]:cur},"Checklist");
}
/* Called with an INDEX, not the option text. Passing the text meant it had
   to survive being embedded in a JS string inside an HTML attribute, and
   HTML entities decode BEFORE JS parses an inline handler — so an option
   containing an apostrophe would break out of the string and throw on tap
   no matter how it was escaped. An integer can't. */
function toggleMultiAt(groupKey,idx){
  const opts=(SCHEMA.D[groupKey+"Opts"])||[];
  const item=opts[idx];
  if(item===undefined){toast("That option isn't in the base",true);return}
  toggleMulti(groupKey,item);
}
function addWater(delta){
  const f=SCHEMA.D.water;if(!f){toast("No water field in the base",true);return}
  const cur=n(DAILY[f]);patchDaily({[f]:Math.max(0,r1(cur+delta))},"Water");
}

/* ---------- ACTIVITY RINGS ----------
   Three concentric arcs, Apple Fitness style. The calorie ring is
   deliberately floor-based: it fills toward 2000 (the floor), not toward a
   cap, so a low day reads as an unfinished ring rather than an achievement.
   Rings never render red — an incomplete ring is just incomplete.       */
function rings(kcal,protein,water){
  // Use the SAME adaptive targets the gate bars use. These were hardcoded at
  // 2000/145, so once the adaptive engine moved protein to ~171g the ring
  // read "closed" while the bar directly beneath it read "21g short".
  const _t=adaptiveTargets();
  const R=[{v:kcal,goal:_t.kcalLo||2000,c:"var(--gold)",c2:"var(--ember)",lab:"kcal"},
           {v:protein,goal:_t.proteinLo||145,c:"#8FCB9B",c2:"#5FA97A",lab:"protein"},
           {v:water,goal:WATER_TARGET,c:"#6FB6D9",c2:"#4A8FB5",lab:"water"}];
  const size=190,cx=size/2,cy=size/2,sw=17,gap=5;
  let arcs="",defs="";
  R.forEach((r,i)=>{
    const rad=cx-sw/2-i*(sw+gap);
    const circ=2*Math.PI*rad;
    const pct=Math.max(0,Math.min(1,(r.v||0)/r.goal));
    const dash=circ*pct;
    defs+=`<linearGradient id="rg${i}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${r.c}"/><stop offset="1" stop-color="${r.c2}"/></linearGradient>`;
    arcs+=`<circle cx="${cx}" cy="${cy}" r="${rad}" fill="none" stroke="var(--surface2)" stroke-width="${sw}"/>
      <circle cx="${cx}" cy="${cy}" r="${rad}" fill="none" stroke="url(#rg${i})" stroke-width="${sw}"
        stroke-linecap="round" stroke-dasharray="${dash} ${circ-dash}"
        transform="rotate(-90 ${cx} ${cy})" style="transition:stroke-dasharray .7s var(--spring)"/>`;
  });
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img"
    aria-label="Calories ${Math.round(kcal)} of 2000, protein ${Math.round(protein)} of 145 grams, water ${r1(water)} of ${WATER_TARGET} litres">
    <defs>${defs}</defs>${arcs}</svg>`;
}
function gateBar(label,val,lo,hi,ceil,floorMsg){
  val=n(val);
  const max=ceil?hi*1.3:hi*1.28;
  const short=!ceil&&val<lo,over=val>hi;
  const cls=ceil?(over?"f-over":"f-ok"):(short?"f-short":over?"f-over":"f-band");
  const pct=Math.min(100,val/max*100);
  const bl=ceil?0:lo/max*100,bw=(hi-(ceil?0:lo))/max*100;
  let st;
  if(ceil)st=over?"+"+Math.round(val-hi)+" over":Math.round(hi-val)+" left";
  else if(short)st=Math.round(lo-val)+(floorMsg||" short");
  else if(over)st="+"+Math.round(val-hi)+" over";
  else st="in band";
  const col=cls==="f-band"?"var(--gold)":cls==="f-over"?"var(--amber)":cls==="f-ok"?"var(--teal)":"var(--short)";
  return `<div class="gate"><div class="gate-hd"><span class="nm">${label}</span>
   <span class="st mono" style="color:${col}">${Math.round(val)}<span style="color:var(--muted)">${ceil?"/"+hi:"/"+lo+"–"+hi}</span> · ${st}</span></div>
   <div class="track"><div class="band" style="left:${bl}%;width:${bw}%"></div>
   <div class="fill ${cls}" style="width:${pct}%"></div></div></div>`;
}

   other answer has a documented default and can be changed later in

const ACTIVITY={sedentary:["Sedentary","desk job, little exercise"],
  light:["Lightly active","1-3 sessions a week"],
  moderate:["Moderately active","3-5 sessions a week"],

  maintain:["Maintain","calorie target around maintenance"],

function wizField(id,label,val,ph,type){

}

/* Reads whatever is currently on screen so answers survive step changes. */
function wizCapture(){
  const g=id=>{const e=document.getElementById(id);return e?e.value.trim():undefined};
  const patch={};
  [["wz_name","name"],["wz_display","displayName"],["wz_app","appName"],["wz_tag","tagline"],
   ["wz_face","faceImage"],["wz_primary","primary"],["wz_ground","ground"],
   ["wz_height","heightCm"],["wz_age","ageYears"],["wz_weight","startingWeightKg"],
   ["wz_targetw","targetWeightKg"],["wz_kcal","kcalFloor"],["wz_protein","proteinPerKg"],
   ["wz_water","waterLitres"],["wz_train","trainingDays"],["wz_base","baseId"],
   ["wz_diet","dietHint"],["wz_avoid","avoidFoods"],["wz_equip","equipment"]
  ].forEach(([el,key])=>{const v=g(el);if(v!==undefined&&v!=="")patch[key]=v});
  if(Object.keys(patch).length)saveSetup(patch);
}
function wizGo(n){ wizCapture(); WIZ_STEP=Math.max(0,Math.min(WIZ_STEPS.length-1,n)); R(); }

function wizFinish(){
  wizCapture();
  const s=SETUP||{};
  if(!s.name||!s.appName){ alert("A name and an app name are needed to continue."); return; }
  saveSetup({completed:true, completedAt:new Date().toISOString()});
  DEMO=false;
  applyBrandingFromSetup();
  state = TOKEN ? "loading" : "needtoken";
  R();
  if(TOKEN) loadAll(true);
}

      <div class="note" style="margin-top:4px">Found in your base's URL. See docs/DATA-MODEL.md for building the base itself.</div>
      <div class="note" style="margin-top:12px;line-height:1.6">

}

function vToday(){
  const D=SCHEMA.D;
  const gap=daysSinceLastLog();
  const training=!!DAILY[D.gymDone];
  const kcal=n(DAILY[D.kcal]);
  let h="";

  /* ============ RESTART MODE ============
     §4, the highest-priority behavioural feature. When active it REPLACES
     the dashboard rather than sitting on top of it: macros, volume, rings
     and score are all hidden, one trivial goal is shown, and every penalty
     is suspended. Showing the full dashboard to someone returning from a
     lapse is what makes day four harder than day one. Returns early. */
  const rs = SCORE.restart;
  if(rs && rs.active){
    const fresh = nextFreshStart();
    return `<div class="card hero" style="text-align:center;padding:26px 18px">
      <img src="${CHAR_URI}" alt="" style="width:96px;height:auto;margin:0 auto 14px;display:block">
      <div class="serif" style="font-size:22px;margin-bottom:8px">Good to see you.</div>
      <div class="note" style="margin-bottom:18px">Nothing to catch up on. Nothing to make up for.
        Just one thing today —</div>
      <div style="font-family:Archivo;font-size:19px;font-weight:600;color:var(--gold);margin-bottom:18px">
        ${esc(rs.goal)}</div>
      <button class="btn p full" onclick="go('food')">Log something</button>
      <div class="note" style="margin-top:14px">Scoring is paused. Two days like this and everything comes back on.</div>
     </div>
     <div class="card tight" style="text-align:center">
      <div class="note">Want a clean line to start from? <b style="color:var(--ink2)">${esc(fresh.label)}</b> works —
      a new block rather than picking up an old one.</div>
     </div>`;
  }

  /* Coach note — a proactive tip fired by confirmMeal()/saveGym() after a
     deterministic check decided something was worth saying. Dismissible;
     never regenerated just by revisiting this tab. */
  if(COACH_TIP){
    h+=`<div class="card tight" style="border-color:rgba(236,154,62,.35)">
     <div class="row sp"><span class="ttl" style="margin-bottom:0">Coach note<span class="mono">${esc(COACH_TIP.source||"")}</span></span>
      <button class="btn sm" onclick="COACH_TIP=null;R()">×</button></div>
     <div class="note" style="margin-top:6px;color:var(--ink2)">${esc(COACH_TIP.text)}</div></div>`;
  }

  /* WEEKLY REVIEW PROMPT — the ritual trigger. Appears once a week, sits
     above everything else because closing the loop on last week is worth
     more than any single number in this week. Dismissed by doing it. */
  if(reviewDue()){
    h+=`<div class="card hero" style="border-color:rgba(236,154,62,.4)">
     <div class="ttl">Weekly review<span class="mono">2 min</span></div>
     <div class="note" style="margin-bottom:11px">Last week is done. Look at it once, pick one thing to change, then forget it.</div>
     <button class="btn p full" onclick="sheet='review';R()">Review the week</button></div>`;
  }

  /* THE ONE ADMIN ACTION — never a list */
  const a=nextAction();
  if(a){
    const opened=dv(a,SCHEMA.A.opened);
    const age=opened?daysBetween(String(opened).slice(0,10),localISO()):null;
    // Medical Actions has no separate Phone/Script fields — everything
    // beyond the title lives in Notes. Pull a phone number out of it
    // automatically if one's written there, so "tap to call" still works.
    const notes=dv(a,SCHEMA.A.notes)||"";
    const phoneMatch=String(notes).match(/(\+?\d[\d\s-]{7,14}\d)/);
    const phone=phoneMatch?phoneMatch[1]:null;
    h+=`<div class="card hero"><div class="ttl">Today's one action<span class="pill xp">+500 XP</span></div>
     <div style="font-family:Archivo;font-size:17px;font-weight:600;margin-bottom:5px">${esc(dv(a,SCHEMA.A.action)||"Action")}</div>
     ${age!==null?`<div class="tiny mono" style="color:var(--amber);margin-bottom:7px">open ${age} days</div>`:""}
     ${notes?`<div class="note" style="background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:10px;color:var(--ink2);margin-bottom:9px;white-space:pre-wrap">${esc(notes)}</div>`:""}
     ${phone?`<a class="btn full" style="margin-bottom:8px;text-decoration:none" href="tel:${esc(phone.replace(/\s/g,""))}">Call ${esc(phone)}</a>`:""}
     <div class="row wrap" style="gap:8px">
      <button class="btn p sm" onclick="markAction('${a.id}','done')">Done</button>
      <button class="btn sm" onclick="markAction('${a.id}','progress')">Made a start (+100)</button></div></div>`;
  }

  /* ACTIVITY RINGS — the at-a-glance view, before any numbers */
  const waterNow=n(DAILY[D.water]);
  const proteinNow=n(DAILY[D.p]);
  const AT_RING=adaptiveTargets();
  h+=`<div class="card" style="text-align:center;padding-top:18px">
   <div style="display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap">
    <div style="flex:none">${rings(kcal,proteinNow,waterNow)}</div>
    <div style="text-align:left;min-width:118px">
     <div style="margin-bottom:11px"><div class="tiny" style="color:var(--gold)">CALORIES</div>
      <div class="mono" style="font-size:17px">${Math.round(kcal)}<span style="color:var(--muted);font-size:12px">/${AT_RING.kcalLo}</span></div></div>
     <div style="margin-bottom:11px"><div class="tiny" style="color:#8FCB9B">PROTEIN</div>
      <div class="mono" style="font-size:17px">${Math.round(proteinNow)}<span style="color:var(--muted);font-size:12px">/${AT_RING.proteinLo}g</span></div></div>
     <div><div class="tiny" style="color:#6FB6D9">WATER</div>
      <div class="mono" style="font-size:17px">${r1(waterNow)}<span style="color:var(--muted);font-size:12px">/${WATER_TARGET}L</span></div></div>
    </div></div>
   ${kcal>0&&kcal<2000?`<div class="note" style="margin-top:12px">Rings fill toward the floor, not a cap. ${Math.round(2000-kcal)} kcal left to close calories.</div>`:""}
  </div>`;

  /* MACRO GATES — carbs first, floor-aware language.
     Calories and protein now come from adaptiveTargets() — TDEE-based
     deficit and bodyweight-based protein once enough data exists, cold-
     start Mifflin-St Jeor before that. Carbs stay on the fixed training/
     rest split — that's a protocol choice, not a population estimate.
     Fibre and Calcium exist per food item but have no Daily Log rollup, so
     they're summed here from today's Food Log entries. Sugar and Legume
     have no field at all — sugar isn't tracked as a gate, and "legume" is
     detected from the item name instead.                                */
  const AT=adaptiveTargets();
  const fibToday=FOODS.reduce((s,f)=>s+n(dv(f,SCHEMA.F.fib)),0);
  const caToday=FOODS.reduce((s,f)=>s+n(dv(f,SCHEMA.F.ca)),0);
  const legumeWords=/dal|rajma|chana|chole|sattu|sambar|lentil|bean/i;
  h+=`<div class="card"><div class="ttl">Macro gates<span class="mono">${training?"training day":"rest day"}</span></div>
   ${gateBar("Carbs",DAILY[D.c],training?220:200,training?225:205)}
   ${gateBar("Calories",kcal,AT.kcalLo,AT.kcalHi,false," below floor — eat more")}
   ${gateBar("Protein",DAILY[D.p],AT.proteinLo,AT.proteinHi)}
   <div class="tiny" style="margin:-4px 0 8px;color:var(--muted)">
    ${AT.kcalConfidence==="HIGH"?"Calorie target from your measured TDEE":"Calorie target: cold-start estimate — "+AT.tdeeDays+"/21 days of data"}
    · ${AT.proteinConfidence==="HIGH"?"protein from weight trend":"protein: fallback until weight trend stabilises"}</div>
   ${collapse('gates2',"Fat, fibre, calcium, sodium",null,
      gateBar("Fat",DAILY[D.f],65,75)+
      gateBar("Fibre",fibToday,25,35)+
      gateBar("Calcium",caToday,700,900)+
      gateBar("Sodium",DAILY[D.na],0,2000,true))}
   <div class="row wrap" style="gap:6px;margin-top:11px">
    ${kcal>0&&kcal<2000?`<span class="pill">${Math.round(2000-kcal)} kcal under the floor — add food, not less</span>`:""}
    ${n(DAILY[D.grain])>1?`<span class="pill warn">${Math.round(n(DAILY[D.grain]))} grains — one-grain rule</span>`:""}
    ${FOODS.some(f=>legumeWords.test(String(dv(f,SCHEMA.F.item)||""))&&String(dv(f,SCHEMA.F.meal)||"")==="Dinner")?`<span class="pill warn">Legumes at dinner — tolerance</span>`:""}
    ${FOODS.some(f=>String(dv(f,SCHEMA.F.tol)||"")==="Trigger")?`<span class="pill warn">Trigger item logged</span>`:""}
   </div>
   <button class="btn p full" style="margin-top:12px" onclick="go('food')">Log food</button></div>`;

  /* SCORE — weekly, never daily. Reward unlocks on the week's rollup. */
  if(SCORE.rulesLoaded && SCORE.week && SCORE.week.max>0){
    const wk=SCORE.week, pct=Math.max(0,Math.min(100,wk.pct*100));
    h+=`<div class="card tight"><div class="ttl">This week
      <span class="mono">${wk.net} / ${wk.max} pts</span></div>
     <div class="track"><div class="fill ${wk.unlocked?"f-band":"f-short"}" style="width:${pct}%"></div>
      <div class="band" style="left:${REWARD_THRESHOLD_PCT*100}%;width:1px"></div></div>
     <div class="tiny" style="margin-top:6px">${wk.unlocked
        ? "Reward unlocked. Non-food only — a purchase, a tracking-free day, kit."
        : Math.round(REWARD_THRESHOLD_PCT*100-pct)+"% to the weekly reward"}</div>
     ${SCORE.today?`<div class="row sp" style="margin-top:9px;padding-top:9px;border-top:1px solid var(--line)">
       <span class="tiny">Today</span>
       <span class="mono tiny">+${SCORE.today.earned}${SCORE.today.lostCapped?" −"+SCORE.today.lostCapped:""} = ${SCORE.today.net}</span></div>`:""}
     ${SCORE.today&&SCORE.today.lostRaw>NEG_CAP?`<div class="tiny" style="margin-top:5px">Losses capped at −${NEG_CAP}. A bad day can't sink the week.</div>`:""}
    </div>`;
  }

  /* WATER */
  const w=n(DAILY[D.water]);
  h+=`<div class="card tight"><div class="ttl">Water<span class="mono">${r1(w)}L / 3.5L</span></div>
   <div class="track"><div class="fill ${w>=WATER_TARGET?"f-band":"f-short"}" style="width:${Math.min(100,w/WATER_TARGET*100)}%"></div></div>
   <div class="row wrap" style="gap:7px;margin-top:11px">
    <button class="btn sm" onclick="addWater(0.25)">+250ml</button>
    <button class="btn sm" onclick="addWater(0.5)">+500ml</button>
    <button class="btn sm" onclick="addWater(1)">+1L</button>
    <button class="btn sm" onclick="addWater(-0.25)">−250</button></div>
   ${new Date().getHours()>=21?`<div class="note" style="margin-top:9px">Past 9PM — evening water cutoff is on.</div>`:""}</div>`;

  /* CHECKLIST — boolean items, then per-item supplement/skincare selects */
  const boolDone=CHECK_BOOL.filter(c=>DAILY[SCHEMA.D[c.f]]).length;
  const multiDone=CHECK_MULTI.reduce((s,g)=>s+((DAILY[SCHEMA.D[g.f]]||[]).length),0);
  const multiTotal=D.suppAMOpts.length+D.suppPMOpts.length+D.skinAMOpts.length+D.skinPMOpts.length;
  /* Collapsed by default. It's ~20 rows and it is the single biggest
     consumer of vertical space on the screen you open at low energy —
     the count in the header is the part you actually need at a glance. */
  const checklistBody=`
   ${CHECK_BOOL.map(c=>`<div class="chk ${DAILY[SCHEMA.D[c.f]]?"done":""}" onclick="toggleCheck('${c.f}')">
    <span class="box">✓</span><span class="lb">${esc(c.l)}<span class="sub">${esc(c.s)}</span></span></div>`).join("")}
   ${CHECK_MULTI.map(g=>{
     const opts=D[g.f+"Opts"]||[];const cur=DAILY[SCHEMA.D[g.f]]||[];
     return `<div style="margin-top:11px;padding-top:11px;border-top:1px solid var(--line)">
      <div class="tiny" style="color:var(--gold);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">${esc(g.label)}</div>
      ${opts.map((o,oi)=>`<div class="chk ${cur.includes(o)?"done":""}" onclick="toggleMultiAt('${g.f}',${oi})">
       <span class="box">✓</span><span class="lb">${esc(o)}</span></div>`).join("")}</div>`;
   }).join("")}`;
  h+=collapse('checklist',"Checklist",(boolDone+multiDone)+"/"+(CHECK_BOOL.length+multiTotal),checklistBody);

  /* ADHERENCE — rates, not streaks. Reference data, not daily-action data,
     so it earns a tap rather than permanent screen space. */
  const adherenceBody=`
   ${[["Food logged",r=>n(dv(r,D.kcal))>0],["Calorie floor held",r=>n(dv(r,D.kcal))>=2000],
      ["Protein in band",r=>{const p=n(dv(r,D.p));return p>=145&&p<=155}],["Trained",r=>!!dv(r,D.gymDone)],
      ["Water 3.5L",r=>n(dv(r,D.water))>=WATER_TARGET]]
   .map(([l,f])=>`<div class="row sp" style="padding:7px 0;border-bottom:1px solid var(--line)">
    <span style="font-size:13.5px">${l}</span><span class="mono tiny">${adherence(7,f)}/7 · ${adherence(30,f)}/30</span></div>`).join("")}
   <div class="row sp" style="padding:9px 0 0"><span style="font-size:13.5px">Held evening cutoff</span>
    <span class="mono tiny">${adherence(7,r=>dv(r,SCHEMA.D.eveningCutoff)===true)}/7 · ${adherence(28,r=>dv(r,SCHEMA.D.eveningCutoff)===true)}/28</span></div>
   <div class="note" style="margin-top:10px">Rolling percentages, not streaks. A missed day moves the number; nothing resets.</div>`;
  h+=collapse('adherence',"Adherence","rolling, not streaks",adherenceBody);

  /* SCREENING FLAGS — pattern-surfacing only, never a diagnosis. Shown
     only when they actually fire; silent otherwise, no manufactured
     urgency on a normal day. */
  const spo2Note = spo2RollingFlag();
  const hrvNote = hrvDeviation();
  if(spo2Note || hrvNote){
    h+=`<div class="card tight"><div class="ttl" style="color:var(--amber)">Worth a look</div>
     ${spo2Note?`<div class="note" style="margin-bottom:${hrvNote?"8px":"0"}">${esc(spo2Note)}</div>`:""}
     ${hrvNote?`<div class="note">${esc(hrvNote.note)} (7d avg ${hrvNote.m7}ms vs 28d ${hrvNote.m28}ms)</div>`:""}</div>`;
  }

  /* TRAINING SUMMARY */
  h+=`<div class="card tight"><div class="ttl">Training<span class="mono">${DAILY[D.gymDone]?"logged":"planned"}</span></div>
   <div style="font-family:Archivo;font-size:15px;font-weight:600">${esc(SPLITS[new Date().getDay()])}</div>
   <div class="note" style="margin-top:3px">Compounds 8–12 · isolation 12–15 · no barbell back squats</div>
   <button class="btn full" style="margin-top:11px" onclick="go('gym')">${DAILY[D.gymDone]?"Log more":"Open session"}</button></div>`;

  return h;
}

   <button class="btn p full" style="margin-top:11px" ${SYNC==="working"?"disabled":""} onclick="readMeal()">${SYNC==="working"?'<span class="spin"></span> Reading…':"Read the macros"}</button>

function gymTodaySummaryCard(){
  const sess=todayGymSession();
  const lifts=todayLifts();
  if(!sess&&!lifts.length)return "";
  const bits=[];
  if(sess){
    const split=dv(sess,SCHEMA.G.split);
    const dur=dv(sess,SCHEMA.G.dur);
    const cardio=dv(sess,SCHEMA.G.cardio);
    const core=dv(sess,SCHEMA.G.core);
    if(split)bits.push(esc(String(split&&split.name||split)));
    if(n(dur))bits.push(dur+" min");
    if(n(cardio))bits.push(cardio+" min cardio");
    if(core)bits.push("core finisher");
  }
  const liftLines=lifts.map(l=>{
    const ex=dv(l,SCHEMA.L.ex),w=dv(l,SCHEMA.L.w),sets=dv(l,SCHEMA.L.sets),reps=dv(l,SCHEMA.L.reps);
    return `<div class="item"><span class="nm">${esc(String(ex||""))}<span class="mc">${n(w)?w+"kg × "+sets+" sets × "+reps+" reps":""}</span></span></div>`;
  }).join("");
  return `<div class="card tight" style="border-color:rgba(143,203,155,.4)">
   <div class="ttl" style="color:var(--teal)">Already logged today${bits.length?`<span class="mono">${esc(bits.join(" · "))}</span>`:""}</div>

   <div class="note" style="margin-top:8px;color:var(--ink2)">Editing below and tapping save will update this, not add a duplicate.</div></div>`;
}
function vGym(){
  if(!GYMTODAY)initGym();
  const g=GYMTODAY;
  const opts=[...Object.values(SPLITS),"Cardio only"].filter((v,i,a)=>a.indexOf(v)===i);
  const isRest=g.split==="Rest";
  const cardioOnly=g.split==="Cardio only";
  const showDuration=!isRest&&!cardioOnly;
  let h=gymTodaySummaryCard();
  h+=`<div class="card tight"><div class="ttl">Voice log<span class="mono">optional</span></div>
   <div class="row" style="gap:8px;align-items:flex-start">
    <textarea id="gymvoice" class="grow" placeholder="bench press 15kg 3x10 and leg press 100kg 4x10 and 20 min cardio">${esc((window._voice&&window._voice.gymvoice)||"")}</textarea>
    <button class="btn mic ${recording&&micTarget==='gymvoice'?"rec":""}" onclick="toggleMic('gymvoice')" aria-label="Voice input">${recording&&micTarget==='gymvoice'?MIC_STOP_ICON:MIC_ICON}</button></div>
   <button class="btn sm full" style="margin-top:9px" onclick="applyGymVoice()">Fill sets from voice</button>
   <div class="note" style="margin-top:7px">Separate exercises with "and" — e.g. "ohp 12.5kg 3x8 and lateral raise 7.5kg 12,12,10". Fills the sets below; nothing saves until you tap Save session. Just did cardio? Say "30 min cardio" — no exercises needed.</div></div>

  <div class="card"><div class="ttl">Session<span class="mono">${localISO()}</span></div>
   <select onchange="setSplit(this.value)">${opts.map(s=>`<option ${s===g.split?"selected":""}>${esc(s)}</option>`).join("")}</select>
   <div class="row wrap" style="gap:9px;margin-top:10px">
    ${showDuration?`<div class="grow"><div class="tiny">Duration (min)</div><input class="mono" inputmode="numeric" value="${g.dur}" onchange="GYMTODAY.dur=this.value"></div>`:""}
    <div class="grow"><div class="tiny">${cardioOnly?"Cardio minutes":"+ Cardio finisher (min)"}</div><input class="mono" inputmode="numeric" value="${g.cardio}" onchange="GYMTODAY.cardio=this.value"></div></div>
   ${g.split==="Rest"?"":`<div class="note" style="margin-top:9px">Compounds 8–12 reps. Isolation 12–15. Lower-body increases capped at 5%.</div>`}</div>`;

  if(isRest){
    // Rest is a prescribed part of the split, not a gap. Nothing to fill in.
    h+=`<div class="card tight"><div class="ttl">Rest day</div>
     <div class="note">Nothing to log. Rest is part of the programme — recovery is where the adaptation actually happens, and this is the day that protects the two leg sessions.</div>
     <div class="note" style="margin-top:8px;color:var(--ink2)">A walk still counts if you want it: put the minutes in Cardio above.</div></div>`;
  }

  if(cardioOnly){
    h+=`<div class="card tight"><div class="note">Cardio-only day — just fill in Cardio minutes above and save. NEAT at 8–10k steps is the bigger lever than any single session.</div></div>`;
  }

  if(!isRest) g.ex.forEach((e,i)=>{
    const comp=COMPOUND.includes(e.n);
    const best=e.sets.length?Math.max(...e.sets.map(s=>n(s.w))):0;
    const pr=e.last&&best>n(e.last);
    h+=`<div class="card tight"><div class="ttl">${esc(e.n)}
     <span class="mono">${e.last?"last "+e.last+"kg":"—"} ${pr?'<span class="pill on">PR</span>':""}</span></div>`;
    e.sets.forEach((s,j)=>{
      const bad=s.r&&(comp?(n(s.r)>12||n(s.r)<8):(n(s.r)>15||n(s.r)<12));
      h+=`<div class="setrow">
       <input class="mono" inputmode="decimal" placeholder="kg" value="${s.w||""}" onchange="setSet(${i},${j},'w',this.value)">
       <input class="mono" inputmode="numeric" placeholder="reps" value="${s.r||""}" onchange="setSet(${i},${j},'r',this.value);R()"
        style="${bad?"border-color:var(--amber)":""}">
       <button class="btn sm" onclick="rmSet(${i},${j})">×</button></div>`;
      if(bad)h+=`<div class="tiny" style="color:var(--amber);margin:-3px 0 7px">${comp?"8–12 on compounds — above that is endurance, not hypertrophy":"12–15 on isolation"}</div>`;
    });
    h+=`<button class="btn sm" onclick="addSet(${i})">+ set</button></div>`;
  });

  if(!isRest) h+=`<div class="card tight"><div class="row" style="gap:8px">
    <input id="newex" class="grow" placeholder="Add an exercise" value="${esc(window._newex||"")}" onchange="window._newex=this.value">
    <button class="btn sm" onclick="addExercise()">Add</button></div>
   <div class="chk ${g.core?"done":""}" style="margin-top:9px" onclick="GYMTODAY.core=!GYMTODAY.core;R()">
    <span class="box">✓</span><span class="lb">Core finisher<span class="sub">3 rounds: plank + leg raises + crunches</span></span></div></div>`;

  const hasExisting=!!todayGymSession();
  h+=`<div class="card"><button class="btn p full" ${SYNC==="working"?"disabled":""} onclick="saveGym()">
   ${SYNC==="working"?'<span class="spin"></span> Saving…':(isRest?(hasExisting?"Update rest day":"Log rest day"):(hasExisting?"Update session":"Save session"))}</button></div>`;
  return h;
}
