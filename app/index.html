<style>
:root{
  --ground:#120D0A; --surface:#1D1712; --surface2:#261E17; --line:#392C20;
  --ink:#F2ECE1; --ink2:#C7BAA4; --muted:#9C8D76;
  --gold:#EC9A3E; --ember:#D9722E;
  --teal:#8FCB9B;      /* on track */
  --amber:#E2694A;     /* over ceiling / attention */
  --short:#7A6E58;     /* under floor — deliberately neutral, never alarming */
  --violet:#B49BE0;    /* xp */
  --spring:cubic-bezier(.34,1.56,.64,1);
  --r:16px;
}
.fwcredit{display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:10.5px;letter-spacing:.04em;color:var(--muted);
  opacity:.6;padding:16px 10px 6px;user-select:none}
.fwmark{width:17px;height:17px;border-radius:50%;opacity:.9;flex:none}
.fwmark-lg{width:34px;height:34px;border-radius:50%;flex:none}
.aboutrow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;
  border-bottom:1px solid var(--line);font-size:13px}
.aboutrow:last-child{border-bottom:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--ground);color:var(--ink);
  font-family:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
#app{max-width:520px;margin:0 auto;padding:0 14px 178px;min-height:100vh;position:relative;z-index:1}
h1,h2,h3{font-family:'Archivo',sans-serif;letter-spacing:-.02em;margin:0}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.serif{font-family:'Fraunces',serif;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:10px 12px;width:100%;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.glow{position:fixed;top:-120px;left:50%;transform:translateX(-50%);width:480px;height:340px;
  background:radial-gradient(closest-side,rgba(236,154,62,.15),rgba(217,114,46,.07) 60%,transparent 75%);filter:blur(10px);pointer-events:none;z-index:0}
.facelogo{height:34px;width:auto;vertical-align:-10px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.toast .facelogo{height:24px;vertical-align:-7px;margin-right:3px}
header{position:sticky;top:0;z-index:30;background:var(--ground);
  padding:calc(14px + env(safe-area-inset-top)) 0 12px;margin:0 -14px;padding-left:14px;padding-right:14px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
  box-shadow:0 10px 18px -14px rgba(0,0,0,.9)}
.brand{font-size:18px;font-weight:700;display:inline-flex;align-items:center;gap:6px;font-family:'Archivo',sans-serif;white-space:nowrap}
.brand em{font-style:normal;background:linear-gradient(135deg,var(--gold),var(--ember));-webkit-background-clip:text;background-clip:text;color:transparent}
.date{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.lvl{font-size:9.5px;color:var(--violet);letter-spacing:.06em;text-transform:uppercase;text-align:right;white-space:nowrap;flex:none}
.lvl b{display:block;font-size:12.5px;color:var(--ink2);letter-spacing:0;text-transform:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px;box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 14px 30px -18px rgba(0,0,0,.7)}
.card.tight{padding:12px 14px}
.card.hero{border-color:rgba(236,154,62,.35);background:linear-gradient(180deg,rgba(236,154,62,.06),var(--surface) 60%)}
.ttl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-family:'Archivo',sans-serif;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ttl .mono{color:var(--muted);letter-spacing:.02em;text-transform:none;font-size:10.5px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.gate{margin-bottom:10px}.gate:last-child{margin-bottom:0}
.gate-hd{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;gap:8px}
.gate-hd .nm{color:var(--ink2)}.gate-hd .st{font-size:11px;font-family:'JetBrains Mono',monospace;text-align:right}
.track{position:relative;height:9px;background:var(--surface2);border-radius:99px;overflow:hidden}
.band{position:absolute;top:0;bottom:0;background:rgba(236,154,62,.15);border-left:1px solid rgba(236,154,62,.5);border-right:1px solid rgba(236,154,62,.5)}
.fill{position:absolute;top:0;bottom:0;left:0;border-radius:99px;transition:width .45s var(--spring)}
.f-short{background:var(--short)}.f-band{background:linear-gradient(90deg,var(--gold),var(--ember))}
.f-over{background:var(--amber)}.f-ok{background:var(--teal)}.f-xp{background:linear-gradient(90deg,var(--violet),#8B7BD8)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:4px 9px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.pill.warn{background:rgba(226,105,74,.14);border-color:rgba(226,105,74,.4);color:var(--amber)}
.pill.ok{background:rgba(143,203,155,.14);border-color:rgba(143,203,155,.4);color:var(--teal)}
.pill.on{background:rgba(236,154,62,.14);border-color:rgba(236,154,62,.45);color:var(--gold)}
.pill.xp{background:rgba(180,155,224,.14);border-color:rgba(180,155,224,.4);color:var(--violet)}
.btn{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .18s var(--spring),background .15s;min-height:44px}
.btn:active{transform:scale(.95)}
/* Anchors styled as buttons were inheriting the browser's default link
   blue, which failed contrast badly on this dark surface — the tap-to-call
   button on Today was close to unreadable. */
a.btn,a.btn:link,a.btn:visited{color:var(--ink);text-decoration:none}
a.btn.p,a.btn.p:link,a.btn.p:visited{color:#1D1006}
.btn.p{background:var(--gold);border-color:transparent;color:#1D1006;font-weight:600;border-radius:999px;box-shadow:0 10px 22px -10px rgba(236,154,62,.5)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:11px;min-height:36px}
.btn.full{width:100%}.btn[disabled]{opacity:.45;pointer-events:none}
.btn.mic{width:46px;min-width:46px;padding:0}
.btn.mic svg{width:19px;height:19px}
.btn.mic.rec{background:var(--amber);border-color:transparent;color:#150A06;animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{opacity:.6}}
nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(18,13,10,.92);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:7px 0 max(7px,env(safe-area-inset-bottom))}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{padding:6px 0 4px;text-align:center;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-family:'Archivo',sans-serif;font-weight:600;transition:color .2s;min-height:44px}
.tab span{display:block;margin:0 auto 3px;width:21px;height:21px;opacity:.55;transition:opacity .2s,transform .2s var(--spring)}
.tab span svg{width:100%;height:100%;display:block}
.tab.on{color:var(--gold)}.tab.on span{opacity:1;transform:translateY(-1px) scale(1.08)}
.note{font-size:12px;color:var(--muted);line-height:1.55}
.item{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .nm{font-size:13.5px}.item .mc{font-size:10.5px;color:var(--muted);font-family:'JetBrains Mono',monospace;display:block;margin-top:2px}
.chk{display:flex;align-items:center;gap:11px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer;min-height:44px}
.chk:last-child{border-bottom:none}
.box{width:21px;height:21px;border-radius:7px;border:1.5px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;transition:.15s}
.chk.done .box{background:var(--gold);border-color:var(--gold);color:#1D1006}
.chk.done .lb{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.lb{font-size:14px;flex:1}.sub{font-size:11px;color:var(--muted);display:block;margin-top:1px}
.dot{width:7px;height:7px;border-radius:99px;flex:none}
.d-Safe{background:var(--teal)}.d-Caution{background:var(--amber)}.d-Trigger{background:#FF6F80}
.setrow{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;align-items:center;margin-bottom:7px}
.tiny{font-size:10.5px;color:var(--muted)}
.spin{width:14px;height:14px;border:2px solid var(--muted);border-top-color:var(--gold);border-radius:99px;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:60;background:var(--surface2);border:1px solid rgba(236,154,62,.5);color:var(--gold);padding:10px 18px;border-radius:99px;font-size:13px;display:inline-flex;align-items:center;gap:7px;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:toastIn .4s var(--spring);max-width:88vw;text-align:center}
@keyframes toastIn{from{transform:translateX(-50%) translateY(10px) scale(.92);opacity:0}}
.err{background:rgba(226,105,74,.1);border:1px solid rgba(226,105,74,.4);border-radius:13px;padding:10px 12px;font-size:12.5px;color:var(--amber);margin-top:8px;word-break:break-word}
textarea{min-height:74px;resize:vertical}
/* boot screen — the flame is the app's one signature mark, so the loading
   state uses it rather than a generic spinner */
.bootflame{filter:drop-shadow(0 0 26px rgba(236,154,62,.4));animation:bootpulse 2.2s ease-in-out infinite}
@keyframes bootpulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.09);opacity:1}}
.bootbar{width:150px;height:3px;background:var(--surface2);border-radius:99px;margin:20px auto 0;overflow:hidden}
.bootbar-fill{height:100%;width:38%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--ember));animation:bootslide 1.25s ease-in-out infinite}
@keyframes bootslide{0%{transform:translateX(-105%)}100%{transform:translateX(300%)}}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.ach div{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 5px;text-align:center;font-size:9.5px;color:var(--muted);line-height:1.3;opacity:.4}
.ach div.got{opacity:1;border-color:rgba(236,154,62,.4);color:var(--gold);background:rgba(236,154,62,.07)}
.ach b{display:block;font-size:19px;margin-bottom:3px;font-weight:400}
.scrim{position:fixed;inset:0;background:rgba(5,4,3,.72);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border:1px solid var(--line);border-bottom:none;border-radius:20px 20px 0 0;width:100%;max-width:520px;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .24s var(--spring)}
@keyframes up{from{transform:translateY(26px);opacity:.4}}
.grip{width:34px;height:4px;background:var(--line);border-radius:9px;margin:0 auto 13px}
.macroGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.macroGrid label{font-size:10px;color:var(--muted);display:block;margin-bottom:3px}
.macroGrid input{padding:7px 8px;border-radius:10px;font-size:13px}
/* Deliberately NOT the same gold-gradient fill as .btn.p — a floating
   utility action shouldn't compete visually with the screen's primary CTA.
   Glass/blur ties it to the same language as the bottom nav instead. */
.coachbtn{position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:45;width:48px;height:48px;
  border-radius:99px;background:rgba(29,23,18,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(236,154,62,.38);display:flex;align-items:center;justify-content:center;color:var(--gold);
  box-shadow:0 8px 22px -10px rgba(0,0,0,.7);transition:transform .18s var(--spring)}
.coachbtn:active{transform:scale(.9)}
.coachbtn svg{width:21px;height:21px}
.coachbtn .dot{position:absolute;top:1px;right:1px;width:10px;height:10px;border-radius:99px;
  background:var(--amber);border:2px solid var(--ground)}
.coachmsgs{max-height:46vh;overflow-y:auto;margin:4px 0 2px;padding-right:2px}
.msg{font-size:13.5px;line-height:1.5;padding:9px 12px;border-radius:14px;margin-bottom:8px;max-width:88%;white-space:pre-wrap}
.msg.user{background:var(--surface2);margin-left:auto;border:1px solid var(--line)}
.msg.assistant{background:rgba(236,154,62,.08);border:1px solid rgba(236,154,62,.25)}
.offbar{display:flex;align-items:center;gap:8px;margin:0 0 12px;padding:9px 12px;border-radius:12px;
  font-size:12.5px;background:rgba(226,105,74,.12);border:1px solid rgba(226,105,74,.35);color:var(--amber)}
.offbar.pending{background:rgba(143,203,155,.1);border-color:rgba(143,203,155,.35);color:var(--teal)}
.photogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.photogrid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.photocap{position:relative;display:block}
.photocap input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.collapse-hd{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:44px;
  background:none;border:none;cursor:pointer;padding:0;text-align:left}
.collapse-hd .ttl{margin-bottom:0;flex:1}
.chev{flex:none;width:18px;height:18px;color:var(--muted);transition:transform .2s var(--spring)}
.chev svg{width:100%;height:100%}
.chev.open{transform:rotate(180deg);color:var(--gold)}
.collapse-body{margin-top:11px;animation:up .2s var(--spring)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<!-- Local, gitignored. Copy config.example.js to config.js and fill it in.
     A 404 here is harmless: the app falls back to safe defaults. -->
<script src="config.js"></script>
<script>
/* =====================================================================
   AbhinavOS — full capture layer, Airtable-backed.

   Design decisions worth knowing:
   1. SCHEMA IS DISCOVERED AT RUNTIME. The app reads the base's own schema
      and maps table/field NAMES to ids. Nothing is hardcoded, so renaming
      or adding a field in Airtable won't break the app.
   2. XP AND ACHIEVEMENTS ARE COMPUTED, NEVER STORED. They are a pure
      function of what's logged. That means they can never desync from the
      data, and there are no extra tables to maintain.
   3. NOTHING WRITES BEFORE CONFIRMATION. A parsed meal lives in memory as
      PLANNED and only reaches Airtable when you tap Confirm.
   4. NO PUNISHING STREAKS. Food/gym/water show rolling rates. Only the
      compliance is shown as a rolling percentage. No streaks anywhere.
   ===================================================================== */

Object.defineProperty(globalThis,"BASE",{get:()=>USER("baseId",(window.ABOS_CONFIG&&window.ABOS_CONFIG.baseId)||"")});
/* ---------- FRAMEWORK CONFIGURATION ----------
   AbhinavOS is a framework. Everything a person needs to make this their
   own app lives in config.js (copy config.example.js). Nothing personal is
   hard-coded below — the fallbacks are the framework's own defaults.

   Attribution: this app is built on the AbhinavOS framework by
   Abhinav Jain. See ATTRIBUTION.md. The footer credit is a condition of
   the licence's Required Notice; please leave it in place.            */
const CFG=(typeof window!=="undefined"&&window.ABOS_CONFIG)||{};
const CFG_BRAND=CFG.branding||{};
const CFG_THEME=CFG.theme||{};
const CFG_PROFILE=CFG.profile||{};
const CFG_TARGETS=CFG.targets||{};

/* The framework's own identity. Not user-configurable — see ATTRIBUTION.md. */
const FRAMEWORK_NAME="AbhinavOS";
const FRAMEWORK_AUTHOR="Abhinav Jain";
const FRAMEWORK_CREDIT="Built on "+FRAMEWORK_NAME+" · Powered by "+FRAMEWORK_AUTHOR;

/* The USER's identity. All of this is theirs to change. */
function APP_NAME_(){ return USER("appName", CFG_BRAND.appName||"AbhinavOS"); }
function APP_TAGLINE_(){ return USER("tagline", CFG_BRAND.tagline||"Personal health operating system"); }
function USER_DISPLAY_NAME_(){ return USER("displayName", CFG_BRAND.displayName||""); }
/* Kept as live getters, not constants, because the Setup Wizard can change
   them mid-session and the header has to follow immediately. */
Object.defineProperty(globalThis,"APP_NAME",{get:APP_NAME_});
Object.defineProperty(globalThis,"APP_TAGLINE",{get:APP_TAGLINE_});
Object.defineProperty(globalThis,"USER_DISPLAY_NAME",{get:USER_DISPLAY_NAME_});

/* Renders "RahulOS" as Rahul<em>OS</em> so the accent styling survives any
   app name. Names not ending in OS simply render whole. */
function brandHTML(){
  const esc0=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const m=/^(.+?)(OS)$/.exec(APP_NAME);
  return m?esc0(m[1])+"<em>"+esc0(m[2])+"</em>":esc0(APP_NAME);
}

/* Storage keys are namespaced so two different forks open in the same
   browser never collide over each other's keys and API tokens. */
const STORE_PREFIX=CFG_BRAND.storagePrefix||"abhinavos";
const SKEY=k=>STORE_PREFIX+"_"+k;

/* Theme tokens map 1:1 onto the CSS custom properties in :root. Anything
   omitted keeps the framework default already set in the stylesheet. */
function applyTheme(){
  if(typeof document==="undefined")return;
  const r=document.documentElement, t=CFG_THEME;
  const map={ground:"--ground",surface:"--surface",surface2:"--surface2",line:"--line",
    ink:"--ink",ink2:"--ink2",muted:"--muted",primary:"--gold",secondary:"--ember",
    success:"--teal",attention:"--amber",neutral:"--short",accent:"--violet",radius:"--r"};
  Object.keys(map).forEach(k=>{ if(t[k])r.style.setProperty(map[k],t[k]); });
  // Wizard answers win over config.js for the two colours it collects.
  const wp=USER("primary",null), wg=USER("ground",null);
  if(wp)r.style.setProperty("--gold",wp);
  if(wg)r.style.setProperty("--ground",wg);
  if(t.fontBody)r.style.setProperty("--font-body",t.fontBody);
  if(t.fontHeading)r.style.setProperty("--font-heading",t.fontHeading);
  if(t.fontBody)document.body&&(document.body.style.fontFamily=t.fontBody);
  document.title=APP_NAME;
}

/* ---------- DEMO DATA ----------
   Deliberately fictional. Round numbers, a made-up name, nobody's real
   figures. Never written anywhere — it exists only in memory for the tour. */
const DEMO_TODAY=(()=>{const d=new Date();return d.toISOString().slice(0,10)})();
function demoRow(fields){ return {id:"demo"+Math.random().toString(36).slice(2,9), fields}; }
function demoResponse(path){
  const D=SCHEMA&&SCHEMA.D||{};
  if(/\/meta\/bases\//.test(path)) return {tables:[]};
  if(SCHEMA&&path.indexOf(SCHEMA.daily.id)>-1){
    return {records:[demoRow({
      [D.date]:DEMO_TODAY,[D.weight]:70,[D.sleep]:7.5,[D.deep]:75,[D.rem]:90,
      [D.awake]:12,[D.water]:2,[D.steps]:8000,[D.kcal]:1500,[D.p]:90,
      [D.c]:160,[D.f]:50,[D.gymDone]:true,[D.mode]:"Normal"
    })]};
  }
  if(SCHEMA&&path.indexOf(SCHEMA.food.id)>-1){
    return {records:[
      demoRow({[SCHEMA.F.item]:"Oats with milk and banana",[SCHEMA.F.meal]:"Breakfast",
        [SCHEMA.F.kcal]:420,[SCHEMA.F.p]:18,[SCHEMA.F.c]:62,[SCHEMA.F.f]:11,[SCHEMA.F.date]:DEMO_TODAY}),
      demoRow({[SCHEMA.F.item]:"Chicken salad wrap",[SCHEMA.F.meal]:"Lunch",
        [SCHEMA.F.kcal]:560,[SCHEMA.F.p]:42,[SCHEMA.F.c]:48,[SCHEMA.F.f]:20,[SCHEMA.F.date]:DEMO_TODAY})
    ]};
  }
  if(SCHEMA&&path.indexOf(SCHEMA.lift.id)>-1){
    return {records:[
      demoRow({[SCHEMA.L.ex]:"Bench Press",[SCHEMA.L.w]:40,[SCHEMA.L.sets]:3,[SCHEMA.L.reps]:10,[SCHEMA.L.date]:DEMO_TODAY}),
      demoRow({[SCHEMA.L.ex]:"Lat Pulldown",[SCHEMA.L.w]:35,[SCHEMA.L.sets]:3,[SCHEMA.L.reps]:12,[SCHEMA.L.date]:DEMO_TODAY})
    ]};
  }
  return {records:[]};
}

function enterDemo(){
  /* Runs the demo through the SAME load pipeline as real data, so the tour
     shows the app actually working rather than an empty shell. The Airtable
     gateway is what makes this safe: in demo mode it serves fictional

  try{
    const raw=localStorage.getItem(STORE_PREFIX+"_"+SETUP_KEY_SUFFIX);
    SETUP=raw?JSON.parse(raw):null;
  }catch(e){ SETUP=null; }
  return SETUP;
}
function saveSetup(patch){
  SETUP=Object.assign({}, SETUP||{}, patch);
  try{ localStorage.setItem(STORE_PREFIX+"_"+SETUP_KEY_SUFFIX, JSON.stringify(SETUP)); }
  catch(e){ console.warn("could not persist setup:",e); }
  return SETUP;
}

/* The single resolver. Wizard answers win, then config.js, then the
   framework default passed in by the caller. */
function USER(path, fallback){
  const seg=path.split(".");
  const dig=o=>{ let v=o; for(const k of seg){ if(v==null)return undefined; v=v[k]; } return v; };
  const a=SETUP?dig(SETUP):undefined;
  if(a!==undefined&&a!==""&&a!==null)return a;
  const b=dig(CFG);
  if(b!==undefined&&b!==""&&b!==null)return b;
  return fallback;
}

/* Each toast owns its own removal timer and its own element reference, so
   a second toast firing before the first expires can no longer strand the
   first one on screen forever (the old bug: one shared timer meant a new
   toast's clearTimeout cancelled the previous toast's removal). Also
   tap-to-dismiss, and a hard cap so toasts can never pile up past 3.     */
function toast(m,bad){
  document.querySelectorAll(".toast").forEach((el,i,all)=>{if(all.length>=3&&i===0)el.remove()});
  const e=document.createElement("div");e.className="toast";e.style.cursor="pointer";
  if(bad){e.style.borderColor="rgba(226,105,74,.6)";e.style.color="var(--amber)";e.textContent=m}
  else{e.innerHTML=FACE_IMG;e.appendChild(document.createTextNode(" "+m))}
  const kill=()=>{clearTimeout(timer);e.remove();restack()};
  e.addEventListener("click",kill);
  document.body.appendChild(e);
  restack();
  const timer=setTimeout(kill,2800);
}
function restack(){
  document.querySelectorAll(".toast").forEach((el,i,all)=>{
    el.style.bottom=(92+(all.length-1-i)*46)+"px";
  });
}

/* ---------- STORAGE SHIM ----------
   The app runs in two very different places: inside the Claude artifact
   sandbox (where window.storage exists and localStorage is blocked) and on
   a normal host like Netlify (where the opposite is true). Probe once, then
   use whichever actually works, so keys persist in both.                  */
const Store=(()=>{
  let mode=null; // "local" | "artifact" | "memory"
  const mem={};
  function probe(){
    if(mode)return mode;
    try{
      const k="__abos_probe";localStorage.setItem(k,"1");
      if(localStorage.getItem(k)==="1"){localStorage.removeItem(k);return mode="local"}
    }catch(e){}
    if(window.storage&&typeof window.storage.get==="function")return mode="artifact";
    return mode="memory"; // private browsing with no APIs — session only
  }
  return {
    async get(k){
      const m=probe();
      try{
        if(m==="local")return localStorage.getItem(k);
        if(m==="artifact"){const r=await window.storage.get(k);return r&&r.value?r.value:null}
      }catch(e){}
      return mem[k]||null;
    },
    async set(k,v){
      const m=probe();
      try{
        if(m==="local"){localStorage.setItem(k,v);return}
        if(m==="artifact"){await window.storage.set(k,v);return}
      }catch(e){}
      mem[k]=v;
    },
    async del(k){
      const m=probe();
      try{
        if(m==="local"){localStorage.removeItem(k);return}
        if(m==="artifact"){await window.storage.delete(k);return}
      }catch(e){}
      delete mem[k];
    },
    mode(){return probe()}
  };
})();

/* ---------- Airtable API call tracker ----------
   Airtable's own API has no endpoint that reports your usage against the
   plan's monthly cap — the only place that number lives is the workspace
   billing page in their web UI. So this counts every request THIS app
   makes, client-side, as a stand-in. It's an estimate, not the account's
   real total: it can't see calls from other integrations/automations
   hitting the same base (the free-plan email itself warns those count
   too), and it's tracked per browser/device — the same token used from
   your phone and laptop keeps two separate counters. Good enough to
   catch "I'm about to blow the monthly cap" from this app's own usage,
   which is the dominant driver after the caching pass. */
const API_USAGE_KEY=SKEY("api_usage"), API_PLAN_KEY=SKEY("api_plan");
let API_USAGE={day:"",dayCount:0,month:"",monthCount:0};
let API_PLAN_CAP=1000; // Free plan default; Team plan is 100,000/mo
async function loadApiUsage(){
  try{const v=await Store.get(API_USAGE_KEY);if(v)API_USAGE=JSON.parse(v)}catch(e){}
  const today=localISO(), mo=today.slice(0,7);
  if(API_USAGE.day!==today)API_USAGE.dayCount=0;
  if(API_USAGE.month!==mo)API_USAGE.monthCount=0;
  API_USAGE.day=today;API_USAGE.month=mo;
}
async function saveApiUsage(){try{await Store.set(API_USAGE_KEY,JSON.stringify(API_USAGE))}catch(e){}}
async function loadApiPlanCap(){try{const v=await Store.get(API_PLAN_KEY);if(v)API_PLAN_CAP=Number(v)||1000}catch(e){}}
async function saveApiPlanCap(v){API_PLAN_CAP=Number(v)||1000;try{await Store.set(API_PLAN_KEY,String(API_PLAN_CAP))}catch(e){}}
function trackApiCall(){
  const today=localISO(), mo=today.slice(0,7);
  if(API_USAGE.day!==today)API_USAGE.dayCount=0;
  if(API_USAGE.month!==mo)API_USAGE.monthCount=0;
  API_USAGE.day=today;API_USAGE.month=mo;
  API_USAGE.dayCount++;API_USAGE.monthCount++;
  saveApiUsage();
}

/* ---------- offline write queue ----------
   The gym is exactly where signal is worst, and a save that silently fails
   is how a logging streak dies. Any write that fails for NETWORK reasons
   (not auth, not validation) is parked locally and replayed in order the
   moment connectivity returns. Reads are never queued — they just fall
   back to the cache. */
const QUEUE_KEY=SKEY("write_queue");
let WRITE_QUEUE=[], FLUSHING=false;
async function loadQueue(){try{const v=await Store.get(QUEUE_KEY);WRITE_QUEUE=v?JSON.parse(v):[]}catch(e){WRITE_QUEUE=[]}}
async function saveQueue(){try{await Store.set(QUEUE_KEY,JSON.stringify(WRITE_QUEUE))}catch(e){}}
/* One queue entry per logical write. A create for a given table+date is
   collapsed onto itself: while offline the app can't see a record that only
   exists as a queued stub, so tapping Save twice used to queue two creates
   and produce two rows for the same day once connectivity returned. */
async function enqueue(path,method,opts){
  const job={path,opts:{method,body:opts.body},ts:Date.now()};
  if(method==="POST"){
    const table=String(path).split("?")[0].split("/").pop();
    let dateKey="";
    try{
      const f=opts.body&&opts.body.records&&opts.body.records[0]&&opts.body.records[0].fields;
      if(f)Object.keys(f).forEach(k=>{const v=f[k];if(typeof v==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(v))dateKey=v});
    }catch(e){}
    if(dateKey){
      job.dedupe="POST:"+table+":"+dateKey;
      const i=WRITE_QUEUE.findIndex(j=>j.dedupe===job.dedupe);
      if(i>=0)WRITE_QUEUE.splice(i,1);
    }
  }
  WRITE_QUEUE.push(job);
  await saveQueue();
}
/* A network failure is recoverable and should queue. An HTTP error from
   Airtable (bad field, rejected token) is NOT — replaying it forever would
   just wedge the queue, so those still throw.
   DELIBERATELY NOT matched here: a request timeout. Promise.race abandons
   the promise but the underlying request may still have SUCCEEDED
   server-side, so treating a timeout as "failed, queue it" duplicated
   every slow POST — a meal logged on 3G got written twice. Timeouts now
   surface as real errors instead. */
function isNetworkFail(e){
  const m=String((e&&e.message)||e||"");
  return /Failed to fetch|NetworkError|network error|Load failed|aborted|ERR_INTERNET|ERR_NETWORK|ERR_CONNECTION|offline/i.test(m);
}
/* Transient server-side conditions: keep the job and retry later. Airtable
   rate-limits at 5 req/sec/base, and the old code DROPPED any job that came
   back 429 — a queued burst silently lost writes while reporting success. */
function isRetryable(e){
  const m=String((e&&e.message)||e||"");
  return /HTTP 429|HTTP 5\d\d|rate limit|RATE_LIMIT|SERVICE_UNAVAILABLE|too many requests/i.test(m);
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function flushQueue(){
  if(FLUSHING||!WRITE_QUEUE.length||!TOKEN||!navigator.onLine)return;
  FLUSHING=true;
  let sent=0, dropped=0;
  try{
    while(WRITE_QUEUE.length){
      const job=WRITE_QUEUE[0];
      try{
        await at(job.path,{...job.opts,_noQueue:true});
        WRITE_QUEUE.shift(); sent++; await saveQueue();
        await sleep(220);                        // stay under 5 req/sec/base
      }catch(e){
        if(isNetworkFail(e))break;               // still offline — stop, keep everything
        if(isRetryable(e)){                      // 429/5xx — back off, keep the job
          job.fails=(job.fails||0)+1;
          await saveQueue();
          if(job.fails<5){await sleep(1200*job.fails);continue}
          break;                                 // give up this round, try again next time
        }
        // Genuinely bad job (rejected field, malformed payload). Drop it so
        // the queue can't wedge, but never silently — it's the user's data.
        WRITE_QUEUE.shift(); dropped++; lastError=(e&&e.message)||String(e);
        await saveQueue();
      }
    }
  }finally{FLUSHING=false}
  if(dropped) toast(dropped+" queued "+(dropped===1?"change":"changes")+" couldn't be saved — see Settings",true);
  if(sent){
    toast(sent+" queued "+(sent===1?"change":"changes")+" synced");
    await loadAll(true);
  }
}
window.addEventListener("online",()=>{R();flushQueue()});
window.addEventListener("offline",()=>R());

/* ---------- Airtable REST ---------- */
/* DEMO MODE. A read-only tour with obviously fictional data so someone can
   see the app before spending an hour building an Airtable base.

   Two hard guarantees, enforced here at the single gateway every Airtable
   call passes through:
     1. In demo mode NOTHING is ever written to Airtable. Mutations are
        refused at this function, not merely hidden in the UI.
     2. Demo data is never mixed with real data — demo mode requires no
        token, and the moment a real token exists demo mode is off.        */
let DEMO=false;

async function at(path,opts={},ms=15000){
  if(DEMO){
    const m=(opts.method||"GET");
    if(m!=="GET") throw new Error("DEMO_READONLY");
    return demoResponse(path);
  }
  if(!TOKEN) throw new Error("No Airtable token set");
  const method=opts.method||"GET";
  const mutating=method!=="GET";
  // Known-offline mutation: queue immediately rather than burning 15s on a
  // request that cannot succeed.
  if(mutating && !opts._noQueue && !navigator.onLine){
    await enqueue(path,method,opts);
    return queuedStub(opts);
  }
  trackApiCall();
  // A real abort, not just an abandoned promise — otherwise a timed-out
  // write keeps travelling and lands anyway, which is how duplicates were
  // being created.
  const ctrl=(typeof AbortController!=="undefined")?new AbortController():null;
  let t; const timer=new Promise((_,rj)=>{t=setTimeout(()=>{
    if(ctrl)try{ctrl.abort()}catch(e){}
    rj(new Error("Airtable didn't respond in "+Math.round(ms/1000)+"s"));
  },ms)});
  const call=(async()=>{
    const res=await fetch(AT+path,{method,
      headers:{"Authorization":"Bearer "+TOKEN,"Content-Type":"application/json"},
      body:opts.body?JSON.stringify(opts.body):undefined,
      signal:ctrl?ctrl.signal:undefined});
    const txt=await res.text(); let j=null; try{j=JSON.parse(txt)}catch(e){}
    if(!res.ok){
      const msg=(j&&j.error&&(j.error.message||j.error.type))||("HTTP "+res.status);
      if(res.status===401||res.status===403) throw new Error("Airtable rejected the token ("+res.status+"). It needs schema.bases:read, data.records:read and data.records:write on this base.");
      throw new Error(msg);
    }
    return j;
  })();
  try{
    return await Promise.race([call,timer]);
  }catch(e){
    if(mutating && !opts._noQueue && isNetworkFail(e)){
      await enqueue(path,method,opts);
      toast("Saved offline — will sync when you're back online");
      return queuedStub(opts);
    }
    throw e;
  }finally{clearTimeout(t)}
}
/* Shape-compatible stand-in so callers that read back created records keep
   working while offline. The local_ ids are replaced by the real ones on
   the next successful refresh after the queue drains. */
function queuedStub(opts){
  const recs=(opts.body&&opts.body.records)||null;
  if(recs) return {records:recs.map(r=>({id:"local_"+Math.random().toString(36).slice(2,10),fields:r.fields||{}}))};
  return {id:"local_pending",fields:(opts.body&&opts.body.fields)||{}};
}

/* ---------- schema ----------
   The app addresses Airtable by field ID, not field name, so renaming a
   column in Airtable never breaks it. The cost is that every ID has to be
   declared once. In the public build these are deliberately blank and are
   overlaid at runtime from config.js — the key names below are the contract,
   the IDs are yours. See docs/DATA-MODEL.md.                              */
async function loadSchema(){

    water:"", steps:"", mode:"",

    skinAM:"", skinPM:"",         // multipleSelects — arrays of strings
    suppAM:"", suppPM:"",         // multipleSelects — arrays of strings
    eveningCutoff:"", habitCount:"",
    nasal:"", left:"",
    bloat:"", energy:"", stress:"",
    alcohol:"", notes:"", foodLink:"",
    kcal:"", p:"", c:"",

    emaWeight:"", tdee:"",
    // Added for the breathing + progress-photo features. Real field IDs read

    photos:"", therapyUsed:"",
    therapyHours:"", deviceIndex:"",
    grog:""
    // Note: this table has no per-day fibre/calcium/sugar rollup fields.

  };
  S.D.stoolFormOpts=["1 - Hard lumps","2 - Lumpy sausage","3 - Cracked sausage",
    "4 - Smooth sausage","5 - Soft blobs","6 - Mushy","7 - Watery"];
  S.muscleVol={id:""};
  S.MV={week:"", group:"",
    sets:"", sessions:""};
  // Multi-select option lists. These MUST match the options configured on the
  // corresponding Airtable multipleSelects fields, or a write is rejected.
  // Supplied from config so the public build ships nobody's actual stack.
  const MS=(window.ABOS_CONFIG&&window.ABOS_CONFIG.multiSelects)||{};
  S.D.skinAMOpts=MS.skinAM||[];
  S.D.skinPMOpts=MS.skinPM||[];

  S.F={
    date:"", meal:"", qty:"",
    item:"", notes:"", day:"",

    c:"", f:"", fib:"",
    na:"", ca:"", grain:"",
    tol:"", note:""
    // No dedicated Sugar or Legume field on Food Log — sugar is folded into
    // the AI note text, and legume-at-dinner is detected by item name instead.
  };
  S.G={
    date:"", split:"", dur:"",
    core:"", cardio:"", rpe:"",
    notes:""
  };
  S.L={
    date:"", ex:"", w:"",
    sets:"", reps:"", side:"",
    notes:""
  };
  S.A={
    action:"", priority:"", category:"",
    opened:"", status:"", done:"",
    notes:""
    // No Phone/Script/Minimum-step fields exist on this table — those live
    // in the Notes field as free text, so the card reads Notes instead.
  };
  S.E={
    name:"", group:"", type:"",
    repMin:"", repMax:"", cur:"",
    uni:"", notes:""
  };
  S.SUP={
    name:"", dose:"", timing:"",
    status:"", purpose:"", notes:"",
    units:"", dailyDose:"",

  S.score={id:""};
  S.DS={
    date:"", earned:"", lostRaw:"",
    logged:"", gap:"", restart:"",
    restartGoal:"", freshStart:"",
    weeklyMax:"", notes:""
  };
  S.dscore={id:""};

  // Lab Panels + Lab Results — build order item 8 (Lab Result Explainer).
  // Both tables already existed in the base with real data; this just wires
  // them in the same way every other table here is wired in.
  S.lp={id:""};
  S.LP={date:"", lab:"", fasting:"", context:""};
  S.lr={id:""};
  S.LR={marker:"", date:"", value:"", unit:"",
    refLow:"", refHigh:"", status:"",
    category:"", notes:""};

  // Overlay the real Airtable IDs from config.js. The literals above are
  // deliberately blank in the public build — the shape is the documentation,
  // the IDs are yours.
  (function overlay(target,patch){
    if(!patch||typeof patch!=="object")return;
    Object.keys(patch).forEach(k=>{
      if(patch[k]&&typeof patch[k]==="object"&&!Array.isArray(patch[k])){
        target[k]=target[k]||{};overlay(target[k],patch[k]);
      }else target[k]=patch[k];

  return S;
}

/* ---------- data loading ---------- */
const flat=r=>({id:r.id,...r.fields});
async function q(tableId,params){return at(`${BASE}/${tableId}?${params}&returnFieldsByFieldId=true`)}
/* Airtable pages at 100 records max; Lab Results (122+) and the 45-day
   Food Log window used by the tolerance hypotheses engine both exceed that, so
   this loops on the response's own offset token until it's exhausted. */
async function qAll(tableId,params){
  let out=[],offset;
  do{
    const p=offset?`${params}&offset=${offset}`:params;
    const r=await q(tableId,p);
    out=out.concat(r.records||[]);
    offset=r.offset;
  }while(offset);
  return out;
}

/* ---------- local cache for slow-changing tables ----------
   Airtable's Free plan caps a base at 1,000 API calls/month. Every full
   loadAll() was firing ~12-15 calls even for tables that barely change
   day to day (score rules, exercise library, supplement stock, lab
   results, the 45-day food/history windows) — opening the app a few
   times a day alone blew through the cap. cachedFetch() reads a fresh
   copy at most once per TTL and serves the last-known copy from Store
   the rest of the time; a real "Refresh from Airtable" tap bypasses it. */
async function cachedFetch(key,ttlMs,loader,force){
  let stale=null;
  try{
    const raw=await Store.get("atcache_"+key);
    if(raw){
      const c=JSON.parse(raw);
      stale=c.data;
      if(!force && Date.now()-c.ts<ttlMs) return c.data;
    }
  }catch(e){}
  try{
    const data=await loader();
    try{await Store.set("atcache_"+key,JSON.stringify({ts:Date.now(),data}))}catch(e){}
    return data;
  }catch(e){
    // Serving data a few minutes past its TTL beats showing the user an
    // empty dashboard that says they've logged nothing. Only rethrow when
    // there's genuinely nothing cached to fall back on.
    if(stale!==null) return stale;
    throw e;
  }
}
async function setCache(key,data){try{await Store.set("atcache_"+key,JSON.stringify({ts:Date.now(),data}))}catch(e){}}
const MIN=60000,HOUR=60*MIN;
const isLocalId=id=>/^local_/.test(String(id||""));

/* Today's record is the anchor for every write, so it gets its own durable
   snapshot: without it a cold start with no signal left the app on a dead
   "Couldn't load" screen — i.e. offline logging didn't work in precisely
   the situation it was built for. */
const TODAY_SNAP_KEY=SKEY("today_snapshot");
async function ensureToday(){
  const d=localISO();
  const key=SCHEMA.D.datekey?"{Date key}":"DATETIME_FORMAT({Date},'YYYY-MM-DD')";
  const f=encodeURIComponent(`${key}='${d}'`);
  try{
    const got=await q(SCHEMA.daily.id,`filterByFormula=${f}&maxRecords=1`);
    if(got.records&&got.records.length){
      try{await Store.set(TODAY_SNAP_KEY,JSON.stringify({date:d,rec:got.records[0]}))}catch(e){}
      return got.records[0];
    }
    const made=await at(`${BASE}/${SCHEMA.daily.id}`,{method:"POST",
      body:{records:[{fields:{[SCHEMA.D.date]:d}}],typecast:true,returnFieldsByFieldId:true}});
    const rec=made.records[0];
    // A queued stub has no real Airtable id. Using it as TODAY_ID would
    // send "local_xxx" into the Food Log's linked-record field, and
    // typecast would happily create a junk Daily Log row named that.
    if(!rec||isLocalId(rec.id)) throw new Error("Couldn't open today's record — no connection");
    try{await Store.set(TODAY_SNAP_KEY,JSON.stringify({date:d,rec}))}catch(e){}
    return rec;
  }catch(e){
    try{
      const snap=JSON.parse(await Store.get(TODAY_SNAP_KEY)||"null");
      if(snap&&snap.date===d&&snap.rec&&!isLocalId(snap.rec.id))return snap.rec;
    }catch(e2){}
    throw e;
  }
}

    // not staring at an Airtable token box they have no context for.

  // both found no record, and both created one — two Daily Log rows for the

  if(force)window._body={};   // a forced refresh should show server truth, not stale drafts

  try{

/* ---------- writes ---------- */
async function patchDaily(fields,label){
  if(!TODAY_ID||isLocalId(TODAY_ID)){toast("Today's record isn't ready yet",true);return false}
  // Apply locally FIRST. Every one of these handlers computes its new value
  // from the current DAILY (water += 250, toggle a supplement in an array),
  // so waiting for the round-trip meant three quick water taps all read the
  // same starting value and the last one won — 250ml recorded instead of
  // 750ml, with no error shown.
  const prev={};
  Object.keys(fields).forEach(k=>{prev[k]=DAILY[k]});
  Object.assign(DAILY,fields);
  SYNC="working";R();
  let ok=false;
  try{
    await at(`${BASE}/${SCHEMA.daily.id}/${TODAY_ID}`,{method:"PATCH",body:{fields,typecast:true,returnFieldsByFieldId:true}});
    // refresh rollups (they're computed Airtable-side)
    try{const r=await at(`${BASE}/${SCHEMA.daily.id}/${TODAY_ID}?returnFieldsByFieldId=true`);if(r&&r.fields)DAILY=r.fields}catch(e){}
    SYNC="idle";lastError=null;
    syncTodayIntoHistory();
    computeScore();toast((label||"Saved")+" ✓");
    ok=true;
  }catch(e){
    Object.assign(DAILY,prev);   // roll back the optimistic write
    SYNC="error";lastError=(e&&e.message)||String(e);toast("Save failed",true);
  }
  R();
  return ok;
}
/* HISTORY drives every rolling metric (adherence, breathing adherence, the
   weekly digest) but is cached for 2 hours, so anything saved today stayed
   invisible to all of them until the cache expired. Keep today's row in
   step locally instead of paying an API call to find out what we just
   wrote. */
function syncTodayIntoHistory(){
  if(!SCHEMA||!SCHEMA.D||!TODAY_ID)return;
  const d=localISO();
  const row={id:TODAY_ID,...DAILY};
  const i=HISTORY.findIndex(h=>String(dv(h,SCHEMA.D.date)||"").slice(0,10)===d);
  if(i>=0)HISTORY[i]=row; else HISTORY.unshift(row);
}
// Small, persistent "Saved ✓" badge next to a section's title — the 2.8s
// toast alone was easy to miss, and was the main reason Body-tab saves
// looked like they'd done nothing even when they'd actually gone through.
let SAVE_FLASH={};
function flashSaved(key){
  SAVE_FLASH[key]=true;R();
  setTimeout(()=>{SAVE_FLASH[key]=false;R();},2200);
}

/* ================= DETERMINISTIC SCORING ENGINE =================
   Layer 2 of the architecture. Pure functions. No LLM, no network, no
   magic numbers — every point value is read from the Score Rules table
   in Airtable (Layer 1). Changing a rule means editing a row, never
   touching this code.

   HARD RULES enforced here, do not "improve" them:
   - Overeating is NEVER penalised. Food scoring rewards logging and
     protein only. There is deliberately no calorie-overshoot rule.
   - Daily negative floor is -25. A bad day cannot destroy a good week.
   - All negative rules are suspended while Restart Mode is active.
   - Unlogged days score 0, not negative (see the deactivated rule's note).
   - No streak counters anywhere. Compliance is a rolling percentage.  */

const NEG_CAP = 25;            // daily floor on losses, from §3 hard rule
const RESTART_TRIGGER_DAYS = 3; // consecutive missed days before Restart Mode
const RESTART_EXIT_COMPLETIONS = 2;
const REWARD_THRESHOLD_PCT = 0.70; // weekly, never daily

let RULES = [];   // raw Score Rules rows
let SUPPLIES = []; // Supplements table, for stock/reorder
let SCORE = { today:null, week:null, restart:null, rulesLoaded:false };

function dv(rec,f){return rec&&f?rec[f]:undefined}
const selName = v => (v && typeof v==="object" && v.name) ? v.name : (v||"");

/* Look a rule up by behaviour text. Returns 0 when inactive or absent, so
   a deactivated row silently stops contributing rather than erroring. */
function rule(behaviour){
  const r = RULES.find(x => String(dv(x,SCHEMA.SCORE.behaviour)||"").toLowerCase()===behaviour.toLowerCase());
  if(!r) return {pts:0, conf:"", active:false, suspend:false, notes:""};
  return {
    pts: n(dv(r,SCHEMA.SCORE.points)),
    conf: selName(dv(r,SCHEMA.SCORE.conf)),
    active: !!dv(r,SCHEMA.SCORE.active),
    suspend: !!dv(r,SCHEMA.SCORE.suspend),
    notes: dv(r,SCHEMA.SCORE.notes)||""
  };
}
function ruleActive(b){const r=rule(b);return r.active?r.pts:0}

/* Score a single Daily Log row. restartActive suspends every negative
   rule flagged "Suspended in Restart Mode". Returns a full breakdown so
   the UI can show its working rather than an unexplained number. */
function scoreDay(h, restartActive){
  const D=SCHEMA.D, lines=[];
  let earned=0, lostRaw=0;

  const add=(behaviour, condition, detail)=>{
    if(!condition) return;
    const r = rule(behaviour);
    if(!r.active || r.pts===0) return;
    if(r.pts<0 && restartActive && r.suspend) return;   // hard rule
    if(r.pts>=0) earned += r.pts; else lostRaw += Math.abs(r.pts);
    lines.push({behaviour, pts:r.pts, conf:r.conf, detail:detail||""});
  };

  const kcal=n(dv(h,D.kcal)), prot=n(dv(h,D.p)), water=n(dv(h,D.water));
  const sleepH=n(dv(h,D.sleep)), steps=n(dv(h,D.steps)), habitCount=n(dv(h,D.habitCount));
  const gym=!!dv(h,D.gymDone);
  const suppAM=(dv(h,D.suppAM)||[]).length, suppPM=(dv(h,D.suppPM)||[]).length;
  const skinAM=(dv(h,D.skinAM)||[]).length, skinPM=(dv(h,D.skinPM)||[]).length;

  // Nutrition — logging and protein only. No overshoot penalty, by design.
  add("Logged all meals honestly", kcal>0, Math.round(kcal)+" kcal logged");
  add("Full day logged", kcal>0 && (sleepH>0||steps>0||water>0));
  add("Hit daily protein target", prot>=145, Math.round(prot)+"g protein");

  add("Gym session completed", gym);
  add("Hit planned lifts for the session", gym && LIFTS.some(l=>
      String(dv(l,SCHEMA.L.date)||"").slice(0,10)===String(dv(h,D.date)||"").slice(0,10)));

  // Total sleep time only. Deep/REM are trend-only — Apple Watch stage
  // accuracy is ~51%, so they must never gate a score.
  add("Slept 7h or more", sleepH>=7, sleepH+"h");
  add("Slept 6-7h", sleepH>=6 && sleepH<7, sleepH+"h");

  add("Hit water target", water>=WATER_TARGET, r1(water)+"L");
  add("8,000+ steps", steps>=8000, Math.round(steps)+" steps");
  add("Full supplement stack taken", suppAM>0 && suppPM>0);
  add("Skincare AM + PM done", skinAM>0 && skinPM>0);

  // Negatives
  add("Missed supplements", suppAM===0 && suppPM===0 && kcal>0);
  add("Skincare missed", skinAM===0 && skinPM===0 && kcal>0);
  const cutoffRule = rule("Tracked habit (per unit)");
  if(habitCount>0 && cutoffRule.active && !(restartActive && cutoffRule.suspend)){
    lostRaw += Math.abs(cutoffRule.pts)*habitCount;
    lines.push({behaviour:"Tracked habit (per unit)", pts:cutoffRule.pts*habitCount, conf:cutoffRule.conf,
                detail:habitCount+" ×"+cutoffRule.pts});
  }

  const lostCapped = restartActive ? 0 : Math.min(lostRaw, NEG_CAP);
  return {earned, lostRaw, lostCapped, net: earned - lostCapped, lines,
          logged: kcal>0 || sleepH>0 || steps>0 || water>0};
}

/* Weekly max = every ACHIEVABLE positive rule, once per day, ×7.
   "Slept 7h or more" and "Slept 6-7h" are mutually exclusive — a day can
   only ever score one of them — so summing both made a literally perfect
   week render as ~94% and quietly raised the reward threshold. Only the
   better of the pair counts. */
function weeklyMax(){
  const SC=SCHEMA.SCORE;
  const positive=RULES.filter(r=>!!dv(r,SC.active)&&n(dv(r,SC.points))>0);
  const EXCLUSIVE=[["slept 7h or more","slept 6-7h"]];
  let total=0;
  const skip=new Set();
  EXCLUSIVE.forEach(group=>{
    const members=positive.filter(r=>group.includes(String(dv(r,SC.behaviour)||"").toLowerCase()));
    if(members.length){
      total+=Math.max(...members.map(r=>n(dv(r,SC.points))));
      members.forEach(r=>skip.add(r.id));
    }
  });
  positive.forEach(r=>{if(!skip.has(r.id))total+=n(dv(r,SC.points))});
  return total*7;
}

/* Restart Mode state machine. Triggered by consecutive missed days, exits
   after two completions. Gap days are GAP, never zeros. */
function restartState(){
  const D=SCHEMA.D;
  const byDate={};
  HISTORY.forEach(h=>{const k=String(dv(h,D.date)||"").slice(0,10); if(k) byDate[k]=h});
  const today=new Date(localISO()+"T12:00:00");
  let missed=0;
  for(let i=1;i<=30;i++){
    const k=localISO(new Date(today.getTime()-i*864e5));
    const h=byDate[k];
    const logged = h && (n(dv(h,D.kcal))>0 || n(dv(h,D.sleep))>0 || n(dv(h,D.steps))>0);
    if(logged) break;
    missed++;
  }
  // Restart Mode must never fire for someone who has never logged. A brand
  // new install has an empty HISTORY, which read as "30 missed days" and
  // replaced the whole dashboard with the returning-from-a-lapse screen —
  // on day one, before they'd done anything. A failed history fetch did the
  // same to an established user. It's a lapse only if there's a baseline to
  // have lapsed from.
  const everLogged = HISTORY.some(h=>n(dv(h,D.kcal))>0 || n(dv(h,D.sleep))>0 || n(dv(h,D.steps))>0);
  const active = everLogged && missed >= RESTART_TRIGGER_DAYS;
  // completions since the lapse ended — used to exit the mode
  let completions=0;
  for(let i=0;i<14;i++){
    const k=localISO(new Date(today.getTime()-i*864e5));
    const h=byDate[k];
    if(h && n(dv(h,D.kcal))>0) completions++; else if(i>0) break;
  }
  return {active: active && completions < RESTART_EXIT_COMPLETIONS,
          missedDays: missed, completions,
          goal: RESTART_GOALS[missed % RESTART_GOALS.length]};
}

/* Deliberately trivial. Never the previous target — the point is that it
   is too small to fail, which is what makes day four survivable. */
const RESTART_GOALS = [
  "Walk 10 minutes today.",
  "Log one meal. Any meal.",
  "Drink one glass of water.",
  "Take your morning supplements.",
  "Put your gym shoes on. That's the whole goal."
];

/* Next named landmark, for fresh-start framing. Post-lapse ONLY — surfacing
   this routinely demotivates people who are already on track (Dai 2018). */
function nextFreshStart(){
  const d=new Date(localISO()+"T12:00:00");
  const dow=d.getDay();
  const daysToMon=((8-dow)%7)||7;
  const mon=new Date(d.getTime()+daysToMon*864e5);
  const firstNext=new Date(d.getFullYear(), d.getMonth()+1, 1);
  const pick = (firstNext-d)/864e5 < daysToMon ? firstNext : mon;
  return {date: localISO(pick),
          label: pick===firstNext ? "the 1st" : "Monday"};
}

function computeScore(){
  if(!RULES.length){SCORE.rulesLoaded=false; return}
  SCORE.rulesLoaded=true;
  const restart = restartState();
  const D=SCHEMA.D;
  const todayRow = HISTORY.find(h=>String(dv(h,D.date)||"").slice(0,10)===localISO()) || DAILY_AS_ROW();
  SCORE.restart = restart;
  SCORE.today = scoreDay(todayRow, restart.active);
  SCORE.weeklyMax = weeklyMax();

  // rolling week net
  const today=new Date(localISO()+"T12:00:00");
  let weekNet=0;
  for(let i=0;i<7;i++){
    const k=localISO(new Date(today.getTime()-i*864e5));
    // Today's live row may not be in HISTORY yet (it's cached for 2h), which
    // made the week total exclude the points the card directly below it was
    // simultaneously showing as earned.
    const h=HISTORY.find(x=>String(dv(x,D.date)||"").slice(0,10)===k)
            || (i===0?DAILY_AS_ROW():null);
    if(h) weekNet += scoreDay(h, restart.active).net;
  }
  SCORE.week = {net:weekNet, max:SCORE.weeklyMax,
                pct: SCORE.weeklyMax? weekNet/SCORE.weeklyMax : 0,
                unlocked: SCORE.weeklyMax? (weekNet/SCORE.weeklyMax)>=REWARD_THRESHOLD_PCT : false};
}
/* Today's live row isn't in HISTORY until Airtable refreshes, so score the
   in-memory DAILY object instead. */
function DAILY_AS_ROW(){return DAILY}

/* =================== PHASE 2 ADDENDUM ENGINE ===================
   Layer 2 (pure functions, engine computes / AI only narrates) additions:
   weight EMA, TDEE, adaptive targets, SpO2 rolling screen, HRV deviation,
   stool-form criteria tolerance-M subtyping. The Airtable schema for all of this already
   exists (Gate is already rewired to read these fields) — what was
   missing was anything that actually computed and wrote them. That's
   this block.                                                          */

const EMA_ALPHA = 0.1;               // ~19-day equivalent window
const KCAL_PER_KG = 7700;
const TDEE_MIN_DAYS = 21;            // rolling window floor before trusting TDEE over the cold-start prior
/* EXAMPLE DEFAULTS — the original author's own protocol choices, not
   medical advice and not right for everyone. Override in config.js. */
Object.defineProperty(globalThis,"PROTEIN_G_PER_KG",{get:()=>Number(USER("proteinPerKg",CFG_TARGETS.proteinPerKg||2.0))});
/* Deficit follows the goal chosen in the wizard unless explicitly overridden. */
const GOAL_DEFICIT={fatloss:0.85, maintain:1.0, muscle:1.10, health:1.0};
Object.defineProperty(globalThis,"RECOMP_DEFICIT",{get:()=>{
  const explicit=USER("deficitMultiplier",null);
  if(explicit)return Number(explicit);
  const g=USER("goal",null);
  return (g&&GOAL_DEFICIT[g])||CFG_TARGETS.deficitMultiplier||0.85;
}});

/* EMA must skip gap days rather than zero them, and resume from the last
   known trend rather than reinitializing — a missed day is absence of
   data, not a data point of zero. */
function computeWeightEMA(){
  const D=SCHEMA.D;
  // Ignore physically implausible entries so one typo can't move the trend.
  const rows=[...HISTORY].filter(h=>{const w=n(dv(h,D.weight));return w>=30&&w<=250})
    .sort((a,b)=>String(dv(a,D.date)).localeCompare(String(dv(b,D.date))));
  let trend=null;
  rows.forEach(h=>{
    const w=n(dv(h,D.weight));
    trend = trend===null ? w : (EMA_ALPHA*w + (1-EMA_ALPHA)*trend);
  });
  return trend===null ? null : Math.round(trend*100)/100;
}

/* TDEE from the energy-balance identity, not the wearable — Apple Watch
   active-calorie error is ~28% MAPE. Cold-start (Mifflin-St Jeor x 1.4–1.6)
   is used only until >=21 days of real intake+weight data exist. */
/* Returns the user's configured profile, or a clearly-flagged neutral
   reference. `configured:false` is what makes the UI honest about it. */
function PROFILE_OR_NULL(){
  const p={
    heightCm:USER("heightCm",CFG_PROFILE.heightCm),
    ageYears:USER("ageYears",CFG_PROFILE.ageYears),
    sex:USER("sex",CFG_PROFILE.sex),
    startingWeightKg:USER("startingWeightKg",CFG_PROFILE.startingWeightKg)
  };
  const has=p&&p.heightCm&&p.ageYears&&p.sex;
  if(has)return{
    heightCm:Number(p.heightCm), ageYears:Number(p.ageYears),
    isMale:String(p.sex).toLowerCase()==="male",
    weightKg:Number(p.startingWeightKg)||70, configured:true
  };
  // Neutral reference values, used ONLY to render a placeholder number.
  // They describe nobody. Set profile in config.js for a real estimate.
  return{heightCm:170, ageYears:35, isMale:true, weightKg:70, configured:false}; // NEUTRAL-REFERENCE-OK
}

function computeTDEE(profileWeightKg,heightCm,ageYears,isMale,profileConfigured){
  const D=SCHEMA.D;
  const rows=[...HISTORY].filter(h=>n(dv(h,D.kcal))>0 && n(dv(h,D.weight))>0)
    .sort((a,b)=>String(dv(a,D.date)).localeCompare(String(dv(b,D.date))));
  if(rows.length < TDEE_MIN_DAYS){
    const bmr = isMale
      ? 10*profileWeightKg + 6.25*heightCm - 5*ageYears + 5
      : 10*profileWeightKg + 6.25*heightCm - 5*ageYears - 161;
    return {value: Math.round(bmr*1.5), source: profileConfigured
        ? "cold-start (Mifflin-St Jeor × 1.5)"
        : "cold-start (no profile set — generic reference, not personalised)", days:rows.length};
  }
  /* Cap the window at 42 days. An open-ended window meant a 6-month-old
     weight anchored the delta, so a long-finished cut kept dragging the
     estimate — and the label still said "energy-balance". */
  const windowed=rows.slice(-42);
  const first=windowed[0], last=windowed[windowed.length-1];
  const days=Math.max(1,daysBetween(String(dv(first,D.date)).slice(0,10),String(dv(last,D.date)).slice(0,10)));
  const meanIntake = windowed.reduce((s,h)=>s+n(dv(h,D.kcal)),0)/windowed.length;
  const w0=n(dv(first,D.weight)), w1=n(dv(last,D.weight));
  const deltaKg = w1-w0;
  const raw = meanIntake - (deltaKg*KCAL_PER_KG/days);
  /* Sanity clamp. A single fat-fingered weight (86.2 typed as 862) produced
     a 14,000kcal TDEE, which then drove a 1,700g protein target and a
     12,000kcal ceiling — every target in the app, wrong, with no warning.
     Physiologically implausible output means the inputs are bad, so fall
     back rather than propagate nonsense. */
  if(!isFinite(raw)||raw<1200||raw>5000){
    const bmr = isMale
      ? 10*profileWeightKg + 6.25*heightCm - 5*ageYears + 5
      : 10*profileWeightKg + 6.25*heightCm - 5*ageYears - 161;
    return {value: Math.round(bmr*1.5), source:"cold-start (implausible energy-balance result ignored)", days:windowed.length};
  }
  return {value: Math.round(raw), source:"energy-balance ("+days+"d window)", days};
}

/* The single function everything else in the UI should call for targets.
   Protein and calories adapt once enough data exists; carbs stay on the
   training/rest split from Layer 1 since that's a fixed protocol choice,
   not a population-prior estimate. */
function adaptiveTargets(){
  const D=SCHEMA.D;
  const weight = computeWeightEMA() || n(DAILY[D.weight]) || null;
  /* Cold-start biometrics. NOT a medical calculation and NOT tuned for
     anyone in particular — Mifflin-St Jeor is a population estimate that
     is wrong for most individuals. It is used only until ~21 days of real
     intake and weight data exist, after which measured energy balance
     replaces it entirely.

     If the user has not supplied a profile, we do NOT quietly substitute
     someone else's body. We fall back to a neutral reference figure and
     label the result so the UI can say the target is unpersonalised.   */
  const prof=PROFILE_OR_NULL();
  const tdeeR = computeTDEE(
    weight || prof.weightKg,
    prof.heightCm, prof.ageYears, prof.isMale, prof.configured);
  const proteinTarget = weight
    ? Math.round(weight*PROTEIN_G_PER_KG)
    : (CFG_TARGETS.proteinFallbackG || 150);
  /* A floor, never a ceiling — the app is built so under-eating is the
     failure it guards against. This is a personal protocol choice, not a
     medical recommendation, and it is meant to be set per person. */
  const kcalFloor = Number(USER("kcalFloor", CFG_TARGETS.kcalFloor || 2000));
  const kcalTarget = Math.max(kcalFloor, Math.round(tdeeR.value*RECOMP_DEFICIT));
  return {
    weight, tdee:tdeeR.value, tdeeSource:tdeeR.source, tdeeDays:tdeeR.days,
    kcalLo: kcalFloor, kcalHi: Math.max(kcalFloor+200, kcalTarget),
    proteinLo: proteinTarget-5, proteinHi: proteinTarget+5,
    proteinConfidence: weight ? "HIGH" : "MEDIUM",
    kcalConfidence: tdeeR.days>=TDEE_MIN_DAYS ? "HIGH" : "MEDIUM"
  };
}

/* Writes today's computed EMA/TDEE back to Airtable so Gate (already
   rewired) and any other view reading the raw fields sees real numbers
   instead of blank cold-start fallbacks. Silent no-op on failure — this
   is a background sync, never something that should block the UI. */
/* Only writes when a value has actually MOVED. This used to PATCH on every
   single app open regardless — one guaranteed wasted API call per load,
   against a 1,000/month Free-plan cap. */
async function syncAdaptiveFields(){
  if(!TODAY_ID||!SCHEMA)return;
  if(isLocalId(TODAY_ID)||!navigator.onLine)return;
  const t=adaptiveTargets();
  const f={};
  if(t.weight!=null && SCHEMA.D.emaWeight
     && Math.abs(n(DAILY[SCHEMA.D.emaWeight])-t.weight)>0.005) f[SCHEMA.D.emaWeight]=t.weight;
  if(SCHEMA.D.tdee && t.tdee!=null
     && Math.round(n(DAILY[SCHEMA.D.tdee]))!==Math.round(t.tdee)) f[SCHEMA.D.tdee]=t.tdee;
  if(!Object.keys(f).length)return;
  try{
    await at(`${BASE}/${SCHEMA.daily.id}/${TODAY_ID}`,{method:"PATCH",body:{fields:f,typecast:true}});
    Object.assign(DAILY,f); // keep local copy in step so the next load is a no-op
  }catch(e){ /* best-effort */ }
}

/* SpO2 screening. HARD RULE: never a diagnosis, never an sleep index number, never
   the word "breathing" as a conclusion — only ever a prompt to discuss with a
   clinician. The Airtable formula flags a single night; this counts
   occurrences over a rolling 7, which is the actual trigger condition. */
function spo2RollingFlag(){
  const D=SCHEMA.D;
  const today=new Date(localISO()+"T12:00:00");
  let lowNights=0, anyData=false;
  for(let i=0;i<7;i++){
    const k=localISO(new Date(today.getTime()-i*864e5));
    const h=HISTORY.find(x=>String(dv(x,D.date)||"").slice(0,10)===k);
    const v=h?n(dv(h,D.spo2)):null;
    if(v){anyData=true; if(v<=88)lowNights++}
  }
  if(!anyData) return null;
  if(lowNights>=3){
    return "Recurring overnight oxygen dips ("+lowNights+" of the last 7 nights) — "+
           "worth discussing with a clinician, or considering a home sleep test.";
  }
  return null;
}

/* ---------- overnight breathing ----------
   Breathing was previously only present as a passive SpO2 screening flag,
   while a real recorded sleep index sat unread in the Lab Results table. If
   therapy starts, the numbers that actually matter are adherence (hours
   per night) and whether mornings stop feeling wrecked — not total sleep
   time, which barely moves. This makes those first-class. */
function labSleepIndex(){
  const g=labMarkerGroups();
  const rows=g["Sleep Breathing Index"];
  if(!rows||!rows.length)return null;
  const r=rows[0];
  return {value:n(dv(r,SCHEMA.LR.value)), date:String(dv(r,SCHEMA.LR.date)||"").slice(0,10),
          status:dv(r,SCHEMA.LR.status)||""};
}
/* AASM severity bands. Reported as bands, never as a diagnosis — the
   diagnosis already exists or doesn't, and this app doesn't make one. */
function indexBand(v){
  if(v==null||!isFinite(v))return "";
  if(v<5)return "below the adult threshold";
  if(v<15)return "mild range";
  if(v<30)return "moderate range";
  return "severe range";
}
/* Denominator is 7 NIGHTS, not "nights we happen to have a row for".
   Counting only logged nights meant 3 therapy nights out of 7 rendered as
   "3/3 · avg 6h" — full adherence — when the real figure was 3/7 at 2.6h
   average, below the very benchmark the card cites. A missing night is a
   night without therapy, not a night that doesn't count. */
function breathingSummary(){
  const D=SCHEMA.D, today=new Date(localISO()+"T12:00:00");
  const NIGHTS=7;
  let onTherapy=0, compliant=0, hoursSum=0, ahis=[], grogs=[], rows=0;
  for(let i=0;i<NIGHTS;i++){
    const k=localISO(new Date(today.getTime()-i*864e5));
    const h=HISTORY.find(x=>String(dv(x,D.date)||"").slice(0,10)===k);
    if(!h)continue;
    rows++;
    if(dv(h,D.therapyUsed))onTherapy++;
    const hr=n(dv(h,D.therapyHours)); if(hr){hoursSum+=hr; if(hr>=4)compliant++}
    const ah=n(dv(h,D.deviceIndex)); if(ah)ahis.push(ah);
    const gr=n(dv(h,D.grog)); if(gr)grogs.push(gr);
  }
  const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
  return {nights:NIGHTS, rowsLogged:rows, onTherapy,
    avgHours:hoursSum?r1(hoursSum/NIGHTS):null,   // averaged over all 7 nights
    compliantNights:compliant,
    avgDeviceIndex:ahis.length?r1(avg(ahis)):null,
    avgGrog:grogs.length?r1(avg(grogs)):null,
    anyTherapy:onTherapy>0||hoursSum>0};
}
async function saveGrog(v){
  const f={}; if(SCHEMA.D.grog)f[SCHEMA.D.grog]=Number(v);
  if(await patchDaily(f,"Morning grogginess")) flashSaved("grog");
}
async function saveBreathing(){
  BAD_FIELD=null;
  const f={},D=SCHEMA.D;
  if(D.therapyUsed) f[D.therapyUsed]=therapyChecked();
  const hrs=readField("f_therapyh"), idx=readField("f_dindex");
  if(!readGate())return;
  if(D.therapyHours&&hrs!=null&&hrs!==undefined) f[D.therapyHours]=hrs;
  if(D.deviceIndex&&idx!=null&&idx!==undefined) f[D.deviceIndex]=idx;
  if(!Object.keys(f).length){toast("Nothing to save yet",true);return}
  if(await patchDaily(f,"Breathing")){

}
/* The tick used to live ONLY as a CSS class on the live DOM node, so any
   re-render (a save flash timer, a coach tip arriving, toggling another
   section) silently reset it — and the next Save then wrote therapyUsed:false
   alongside a full night of therapy hours. It's real state now. */
function therapyChecked(){
  const b=window._body||{};
  return b.f_therapyused!==undefined ? !!b.f_therapyused : !!DAILY[SCHEMA.D.therapyUsed];
}
function toggleTherapy(){
